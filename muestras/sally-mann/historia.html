<!DOCTYPE html><html lang="es" data-theme="light"><head><meta charset="utf-8">

<title>Macula et Materia · Historia</title>
<script>(function(){var t;try{t=localStorage.getItem("ars-tema")}catch(e){}document.documentElement.dataset.theme=t==="oscuro"?"dark":"light";})();</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  :root{
    --bg:#15110d; --ink:#f1e9dc; --ink-dim:#cabfae; --ember:#c4703f;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --font-title: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --font-body: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    --text-scale:1;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);}
  .debug{position:fixed; top:10px; left:10px; z-index:9999; background:rgba(0,0,0,.65);
    color:#9be39b; font:12px/1.4 var(--sans); padding:6px 10px; border-radius:4px;
    pointer-events:none; border:1px solid rgba(155,227,155,.3);}
  .story-scroll{ position:relative; width:100%; }
  .stage{ position:sticky; top:0; left:0; width:100%; height:100dvh; overflow:hidden; }
  .cover, .state, .credits{ position:absolute; inset:0; width:100%; height:100%; }
  .cover{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    padding:40px 24px; position:relative; overflow:hidden;
    background: radial-gradient(120% 90% at 30% 20%, #6b5337, #1a140d 70%); }
  .cover .cover-logo{ position:absolute; top:20px; left:20px; z-index:3; max-height:48px; max-width:160px;
    object-fit:contain; filter:brightness(0) invert(1); opacity:.85; }
  .cover .cover-bg{ position:absolute; inset:0; background-size:cover; background-position:center; z-index:0; }
  .cover .cover-bg.zoom{ animation:kenburns 16s ease-in-out infinite alternate; }
  @keyframes kenburns{ from{transform:scale(1.05)} to{transform:scale(1.2)} }
  .cover .cover-overlay{ position:absolute; inset:0; z-index:1;
    background:linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,.3) 50%, rgba(0,0,0,.55)); }
  .cover .hero{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; max-width:560px; }
  .cover .foot{ position:absolute; left:0; right:0; bottom:34px; z-index:2; display:flex; flex-direction:column; align-items:center; gap:18px; }
  .cover .byline{ font:12px/1.4 var(--sans); letter-spacing:.04em; color:var(--ink-dim); }
  .cover .kicker{ font:13px/1 var(--sans); letter-spacing:.08em; text-transform:uppercase; color:var(--ember); margin-bottom:10px; }
  .cover h1{ font-family:var(--font-title); font-size:clamp(30px,8vw,50px); line-height:1.14; margin:0 0 16px; font-weight:600; max-width:560px; }
  .cover .sub{ font-family:var(--sans); font-size:calc(16px * var(--text-scale)); line-height:1.5; color:var(--ink-dim); margin:0 0 24px; max-width:520px; }
  .cover .share{ display:flex; gap:22px; align-items:center; justify-content:center; margin:0; }
  .cover .share button{ background:none; border:none; padding:0; cursor:pointer; color:var(--ink); opacity:.82;
    width:24px; height:24px; display:flex; align-items:center; justify-content:center; transition:opacity .15s; }
  .cover .share button:hover{ opacity:1; }
  .cover .share svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .cover .down{ align-self:center; width:40px; height:40px; border:1.5px solid rgba(241,233,220,.55); border-radius:50%;
    display:flex; align-items:center; justify-content:center; opacity:.9; animation:bob 1.8s ease-in-out infinite; }
  .cover .down svg{ width:18px; height:18px; fill:none; stroke:var(--ink); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(6px)} }
  .story-progress{ position:fixed; left:0; bottom:0; width:100%; height:3px; z-index:9998; background:rgba(255,255,255,.18); }
  .story-progress > i{ display:block; height:100%; width:100%; background:rgba(255,255,255,.92); transform:scaleX(0); transform-origin:left center; }
  .share-toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:9999;
    background:rgba(0,0,0,.85); color:var(--ink); font:13px/1 var(--sans); padding:10px 16px; border-radius:20px;
    opacity:0; transition:opacity .25s; pointer-events:none; }
  .share-toast.show{ opacity:1; }
  .state-media{ position:absolute; inset:0; width:100%; height:100%; display:flex;
    align-items:center; justify-content:center; overflow:hidden; background:#000; }
  .state-media .blur-fill{ position:absolute; inset:-30%; filter:blur(60px); background-size:cover; background-position:center; }
  .state-media .sharp{ position:relative; width:78%; max-width:520px; aspect-ratio:3/4;
    border-radius:2px; box-shadow:0 30px 70px rgba(0,0,0,.5); display:flex; align-items:flex-end;
    padding:18px; background-size:cover; background-position:center; }
  .state-media .sharp .tag{ font:12px/1.3 var(--sans); color:rgba(255,255,255,.75);
    background:rgba(0,0,0,.35); padding:4px 8px; border-radius:3px; }
  .state-media .sharp.zoom-canvas{ display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; transform-origin:50% 50%; }
  .zoom-canvas .quad{ display:flex; align-items:center; justify-content:center; font:700 34px/1 var(--sans); color:rgba(255,255,255,.85); }
  .state-media.fit-cover .sharp{ width:100%; height:100%; max-width:none; aspect-ratio:auto;
    border-radius:0; box-shadow:none; display:block; padding:0; }
  .state-media.fit-wide .sharp{ position:relative; width:100%; max-width:none; height:auto; aspect-ratio:auto;
    border-radius:0; box-shadow:none; padding:0; display:block; }
  .state-media.tone-bw   .sharp{ filter:grayscale(100%) contrast(108%); }
  .state-media.tone-bw   .blur-fill{ filter:blur(60px) grayscale(100%) contrast(108%); }
  .state-media.tone-warm .sharp{ filter:sepia(35%) saturate(85%) contrast(105%) brightness(98%); }
  .state-media.tone-warm .blur-fill{ filter:blur(60px) sepia(35%) saturate(85%); }
  .state-media.tone-mute .sharp{ filter:saturate(60%); }
  .state-media.tone-mute .blur-fill{ filter:blur(60px) saturate(60%); }
  .state-media .scrim{ position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.7), transparent 55%); pointer-events:none; }
  /* ---- modo agua: el .blur-fill deja de ser cristal esmerilado y pasa a sentirse como columna de agua ----
         Clave: a escala casi real (como el experimento, ~8% de margen), no recortado al centro.
         La intensidad del desenfoque se controla por bloque vía --agua-blur. ---- */
  .state-media.bg-agua{ --agua-blur:30px; }
  .state-media.bg-agua .blur-fill{ inset:-4%; filter:blur(var(--agua-blur)) brightness(.5) saturate(1.35); }
  .state-media.bg-agua.tone-bw   .blur-fill{ filter:blur(var(--agua-blur)) brightness(.5) saturate(1.35) grayscale(100%) contrast(108%); }
  .state-media.bg-agua.tone-warm .blur-fill{ filter:blur(var(--agua-blur)) brightness(.55) sepia(20%) saturate(1.1); }
  .state-media.bg-agua.tone-mute .blur-fill{ filter:blur(var(--agua-blur)) brightness(.55) saturate(.9); }
  .state-media.bg-agua::after{ content:''; position:absolute; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 32%, rgba(10,58,90,.32) 0%, rgba(4,17,29,.5) 62%, rgba(2,10,20,.62) 100%); mix-blend-mode:multiply; }
  /* ---- capas de partículas en suspensión. Canvas 2D puro, sin dependencias.
         amb-out: gruesas, por TODO el fondo (detrás de la foto, pantalla del bloque completa).
         amb-in:  finas, encima de la foto (otra capa sobre la imagen). ---- */
  .ambient{ position:absolute; inset:0; pointer-events:none; }
  .ambient.amb-out{ z-index:1; }   /* gruesas: a pantalla completa, DETRÁS de la foto */
  .sharp .ambient.amb-in{ z-index:2; }  /* finas: dentro del sharp, recortadas a la foto */
  .sharp{ overflow:hidden; }   /* recorta las finas al área exacta de la foto */
  .sharp-wrap{ position:relative; display:flex; align-items:center; justify-content:center; }
  .state-media.bg-agua .blur-fill, .state-media.has-amb-out .blur-fill{ z-index:0; }
  .state-media.bg-agua .sharp, .state-media.has-amb-out .sharp{ z-index:2; }   /* la foto por encima de las gruesas */
  .state-media.bg-agua .scrim, .state-media.has-amb-out .scrim{ z-index:5; }   /* el velo de "a sangre" por encima de todo */
  /* ---- visor de zoom interactivo (pellizco + arrastre), CSS transforms puros ---- */
  /* El botón es FIXED (global, uno solo): completamente fuera del stack de GSAP y de
     cualquier stacking context del motor. El tap siempre llega. syncActiveBlock lo
     muestra/oculta y le pone el src del bloque activo. */
  .zoom-btn{ position:fixed; bottom:24px; right:20px; width:36px; height:36px; border-radius:50%;
    background:rgba(0,0,0,.52); border:1px solid rgba(255,255,255,.32); color:rgba(255,255,255,.92);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:9996;
    backdrop-filter:blur(6px); opacity:0; pointer-events:none; transition:background .15s, opacity .25s; }
  .zoom-btn.visible{ opacity:1; pointer-events:auto; }
  .zoom-btn:hover{ background:rgba(0,0,0,.72); }
  .zoom-btn svg{ width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; }
  .zoom-viewer{ position:fixed; inset:0; z-index:9997; background:#040e1a; display:none;
    align-items:center; justify-content:center; overflow:hidden; touch-action:none; opacity:0; }
  .zoom-viewer.open{ display:flex; }
  .zoom-viewer.fade{ opacity:1; transition:opacity .45s ease; }
  .zoom-viewer img{ position:absolute; max-width:none; will-change:transform; user-select:none; -webkit-user-drag:none; }
  .zoom-viewer img.intro{ transition:transform .55s cubic-bezier(.22,1,.36,1); }
  .zoom-exit{ position:fixed; top:16px; right:16px; width:34px; height:34px; border-radius:50%;
    background:rgba(4,20,36,.9); border:1px solid rgba(232,244,247,.28); color:#e8f4f7;
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:9999;
    backdrop-filter:blur(8px); }
  .zoom-exit svg{ width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; }
  .zoom-hint{ position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:9999;
    font:12px/1 var(--sans); color:rgba(232,244,247,.62); pointer-events:none;
    background:rgba(4,20,36,.6); padding:8px 14px; border-radius:20px; transition:opacity .4s; }
  .caption{ position:absolute; left:0; right:0; bottom:0; padding:28px 24px 56px; max-width:560px; margin:0 auto; }
  .caption p{ font-size:calc(17px * var(--text-scale)); line-height:1.55; margin:0; color:var(--ink); text-shadow:0 2px 14px rgba(0,0,0,.55); }
  .credits{ background:var(--bg); display:flex; flex-direction:column; justify-content:center; align-items:flex-start; padding:0 24px; max-width:560px; margin:0 auto; }
  .credits h2{ font-family:var(--font-title); font-size:22px; color:var(--ember); margin:0 0 14px; }
  .credits p{ font:15px/1.6 var(--sans); color:var(--ink-dim); margin:0; }
  .state .state-media{ transform:translateY(100dvh); }
  .credits{ transform:translateY(100dvh); }
  .caption{ transform:translateY(100dvh); opacity:1; }
  /* ⓘ ficha del objeto */
  .pi-btn{ position:absolute; bottom:62px; right:16px; width:30px; height:30px; border-radius:50%;
    background:rgba(0,0,0,.42); border:1px solid rgba(255,255,255,.28); color:rgba(255,255,255,.88);
    font:600 14px/30px var(--sans); text-align:center; cursor:pointer; z-index:20;
    backdrop-filter:blur(4px); transform:translateY(100dvh); transition:background .15s; }
  .pi-btn:hover{ background:rgba(0,0,0,.65); }
  .pi-panel{ position:absolute; inset:0; background:rgba(10,8,6,.82); backdrop-filter:blur(10px);
    display:flex; flex-direction:column; justify-content:flex-end; padding:32px 24px 52px;
    z-index:21; opacity:0; pointer-events:none; transition:opacity .2s; transform:translateY(100dvh); }
  .pi-panel.open{ opacity:1; pointer-events:auto; }
  .pi-close{ position:absolute; top:16px; right:16px; background:none; border:none;
    color:rgba(255,255,255,.55); font-size:20px; cursor:pointer; padding:6px 10px; }
  .pi-close:hover{ color:var(--ink); }
  .pi-name{ font:600 20px/1.2 var(--font-title); color:var(--ink); margin-bottom:16px; }
  .pi-fields{ display:flex; flex-direction:column; gap:8px; }
  .pi-field{ display:flex; gap:12px; align-items:baseline; }
  .pi-label{ font:10px/1.4 var(--sans); letter-spacing:.08em; text-transform:uppercase;
    color:rgba(255,255,255,.45); min-width:88px; flex-none; }
  .pi-value{ font:13px/1.45 var(--sans); color:var(--ink-dim); }
:root{--font-title:'Cormorant', Georgia, serif;--font-body:'Alegreya', Georgia, serif;--text-scale:1.15;}</style>
<style id="capa-adn-relato">
/* ================================================================
   CAPA ADN · REGISTRO RELATO · BANDA
   Reutilizable: se añade sobre el motor sin tocar buildStory.
   La imagen arriba, entera; el texto en una banda debajo. Sin velo,
   sin partículas, sin fondos de ambiente: la obra es el color.
   ================================================================ */
:root{
  --c-fondo:#FFFFFF; --c-texto:#000000; --c-apagado:#6B6B6B; --c-filete:rgba(0,0,0,.25);
  --c-acento:#CDBF9A; --c-acento-texto:#806B37;
  --fuente:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --t-titulo:42px; --t-obra:27px; --t-cuerpo:18px; --t-pieza:15px; --t-dato:12px; --t-cabecera:15px;
  --e-1:9px; --e-2:18px; --e-3:27px; --e-4:45px; --e-5:72px;
  --margen:24px; --fila:56px; --interlineado:1.45;
  --cab:44px; --sup:env(safe-area-inset-top,0px); --inf:env(safe-area-inset-bottom,0px);
  --alto-util:calc(100dvh - var(--sup) - var(--cab));
  --visor:calc(var(--alto-util) * .6);
  /* alias para que el resto del CSS del motor herede el ADN */
  --bg:var(--c-fondo); --ink:var(--c-texto); --ink-dim:var(--c-apagado); --ember:var(--c-acento-texto);
  --font-title:var(--fuente); --font-body:var(--fuente); --sans:var(--fuente); --serif:var(--fuente);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--c-fondo:#0E0E0D;--c-texto:#F2F1ED;--c-apagado:#8A8A85;--c-filete:rgba(242,241,237,.2);--c-acento-texto:#CDBF9A}
}
:root[data-theme="dark"]{--c-fondo:#0E0E0D;--c-texto:#F2F1ED;--c-apagado:#8A8A85;--c-filete:rgba(242,241,237,.2);--c-acento-texto:#CDBF9A}
html,body{background:var(--c-fondo);color:var(--c-texto);font-family:var(--fuente);-webkit-font-smoothing:antialiased}
.ico{flex:none;stroke-linecap:square;stroke-linejoin:miter}

/* Cabecera global */
.cab-relato{position:fixed;top:0;left:0;right:0;z-index:9990;background:var(--c-fondo);padding-top:var(--sup)}
.cab-relato{display:flex;align-items:center;gap:var(--e-2);height:calc(var(--cab) + var(--sup));padding-left:var(--margen);padding-right:var(--margen);
  font-size:var(--t-cabecera);color:var(--c-apagado)}
.cab-relato .atras{color:inherit;display:flex}
.cab-relato span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Portada: texto fuera de la imagen, la imagen llena el hueco */
.cover{background:var(--c-fondo)!important;display:flex!important;flex-direction:column;align-items:stretch!important;justify-content:flex-start!important;
  text-align:left!important;padding:calc(var(--sup) + var(--cab)) 0 0!important}
.cover .cover-overlay{display:none}
.cover .hero{order:1;align-items:flex-start!important;padding:var(--e-4) var(--margen) var(--e-3);max-width:430px}
.cover .kicker{order:0;font:var(--t-dato)/1.4 var(--fuente);letter-spacing:0;text-transform:none;color:var(--c-apagado);margin:0 0 var(--e-2)}
.cover h1{font:500 var(--t-titulo)/1.02 var(--fuente);letter-spacing:-.015em;margin:0}
.cover .sub{font:var(--t-cuerpo)/var(--interlineado) var(--fuente);color:var(--c-texto);margin:var(--e-2) 0 0}
.cover .share{margin-top:var(--e-2);gap:var(--e-2)}
.cover .share button{color:var(--c-apagado);opacity:1}
.cover .share svg{stroke-width:1.1;stroke-linecap:square;stroke-linejoin:miter}
.cover .cover-bg{order:2;position:relative!important;inset:auto!important;flex:1;min-height:0;margin:0 var(--margen)}
.cover .foot{order:3;position:relative!important;bottom:auto!important;flex-direction:row!important;justify-content:space-between!important;
  height:var(--fila);padding:0 var(--margen);margin-bottom:var(--inf)}
.cover .byline{font:var(--t-cuerpo) var(--fuente);letter-spacing:0;color:var(--c-texto)}
.cover .down{border:0;width:auto;height:auto;animation:none}
.cover .down svg{stroke:var(--c-texto);stroke-width:1.1;stroke-linecap:square;stroke-linejoin:miter;width:22px;height:22px}

/* Imagen: arriba, entera, sobre el fondo de la muestra */
.state{pointer-events:none}
.state .state-media{inset:auto!important;top:calc(var(--sup) + var(--cab))!important;left:0!important;right:0!important;
  height:var(--visor)!important;background:var(--c-fondo)!important;padding:var(--e-1) var(--margen) 0}
.state-media .blur-fill,.state-media .scrim,.ambient,.state-media .sharp .tag{display:none!important}
.state-media.bg-agua::after{display:none}
.state-media .sharp,.state-media.fit-wide .sharp,.state-media.fit-cover .sharp{box-shadow:none!important;border-radius:0!important;padding:0!important}
.state-media.fit-wide img.sharp,.state-media.fit-wide .sharp-wrap img{width:auto!important;height:auto!important;max-width:100%!important;max-height:100%!important;display:block}
.state-media.fit-wide .sharp-wrap{width:auto!important;max-width:100%;max-height:100%}
.state-media.fit-wide img.sharp{width:auto!important;max-width:100%;max-height:100%;object-fit:contain}
.state-media.fit-cover .sharp,.state-media:not(.fit-wide):not(.fit-cover) .sharp{width:100%!important;height:100%!important;max-width:none!important;aspect-ratio:auto!important;
  background-size:contain!important;background-repeat:no-repeat;background-color:transparent!important}

/* Banda de texto: debajo de la imagen, recorta lo que entra y sale */
.banda{position:absolute;left:0;right:0;top:calc(var(--sup) + var(--cab) + var(--visor));bottom:0;overflow:hidden;pointer-events:none}
.caption{position:absolute!important;left:0;right:0;top:0;bottom:0!important;max-width:430px;margin:0 auto;padding:var(--e-3) var(--margen) 0!important}
.caption p{font:var(--t-cuerpo)/var(--interlineado) var(--fuente)!important;color:var(--c-texto)!important;text-shadow:none!important;max-width:33ch}

/* Ficha (ⓘ) y lupa: en la esquina de la imagen, solo en la escena activa */
.pi-btn{pointer-events:auto;top:calc(var(--sup) + var(--cab) + var(--visor) - 38px);bottom:auto;right:calc(var(--margen) + 44px);
  width:32px;height:32px;border-radius:0;background:var(--c-fondo);border:1px solid var(--c-filete);color:var(--c-texto);
  font:500 14px/30px var(--fuente);backdrop-filter:none;opacity:0;transition:opacity .2s}
.state.block-active .pi-btn{transform:none;opacity:1}
.pi-panel{background:var(--c-fondo);backdrop-filter:none;justify-content:flex-start;padding:calc(var(--sup) + var(--cab) + var(--e-4)) var(--margen) var(--e-4);
  z-index:9991;position:fixed}
.state.block-active .pi-panel{transform:none}
.pi-panel.open{pointer-events:auto}
body:has(.pi-panel.open) .zoom-btn{opacity:0;pointer-events:none}
.pi-close{top:calc(var(--sup) + var(--cab) + 4px);right:var(--margen);color:var(--c-texto);font-size:18px}
.pi-name{font:500 var(--t-obra)/1.15 var(--fuente);color:var(--c-texto);margin-bottom:var(--e-4)}
.pi-fields{gap:0}
.pi-field{padding:10px 0;border-bottom:1px solid var(--c-filete);gap:var(--e-2)}
.pi-label{font:var(--t-dato)/1.4 var(--fuente);letter-spacing:0;text-transform:none;color:var(--c-apagado);min-width:88px}
.pi-value{font:var(--t-pieza)/1.5 var(--fuente);color:var(--c-texto)}
.zoom-btn{top:calc(var(--sup) + var(--cab) + var(--visor) - 38px);bottom:auto;right:var(--margen);width:32px;height:32px;border-radius:0;
  background:var(--c-fondo);border:1px solid var(--c-filete);color:var(--c-texto);backdrop-filter:none}
.zoom-btn svg{stroke-width:1.1;stroke-linecap:square}
.zoom-viewer{background:var(--c-fondo)}
.zoom-exit{top:calc(var(--sup) + 12px);right:var(--margen);border-radius:0;background:var(--c-fondo);border:1px solid var(--c-filete);color:var(--c-texto);backdrop-filter:none}
.zoom-exit svg{stroke-width:1.1;stroke-linecap:square}
.zoom-hint{font:var(--t-dato)/1 var(--fuente);color:var(--c-fondo);background:var(--c-texto);border-radius:0}

/* Progreso y aviso */
.story-progress{height:2px;background:var(--c-filete)}
.story-progress > i{background:var(--c-texto)}
.share-toast{background:var(--c-texto);color:var(--c-fondo);font:13px/1 var(--fuente);border-radius:0}

/* Créditos y salida a la microapp */
.credits{background:var(--c-fondo)!important;justify-content:flex-start!important;padding:calc(var(--sup) + var(--cab) + var(--e-5)) var(--margen) 0!important;max-width:430px}
.credits h2{font:500 var(--t-pieza)/1.3 var(--fuente);color:var(--c-texto);margin:0 0 var(--e-2);padding-top:var(--e-3);border-top:1px solid var(--c-filete);width:100%}
.credits p{font:var(--t-dato)/1.6 var(--fuente);color:var(--c-apagado)}
.salidas{width:100%;margin-top:var(--e-4);pointer-events:auto}
.salida{display:flex;align-items:center;justify-content:space-between;height:var(--fila);color:var(--c-texto);text-decoration:none;
  border-bottom:1px solid var(--c-filete);font-size:var(--t-cuerpo)}
.salida:first-child{background:var(--c-acento);color:#000;padding:0 20px;border:0;margin-bottom:var(--e-1)}

/* Capítulo: la serie abre su tramo con su nombre, en el hueco de la imagen */
.state-media.capitulo{flex-direction:column;justify-content:flex-end!important;align-items:flex-start!important}
.cap-card{width:100%;max-width:430px;padding:0 0 var(--e-4)}
.cap-kicker{font:var(--t-dato)/1.4 var(--fuente);color:var(--c-apagado);margin:0 0 var(--e-2)}
.cap-titulo{font:500 var(--t-titulo)/1.02 var(--fuente);letter-spacing:-.015em;margin:0;color:var(--c-texto)}
.cap-tema{font:var(--t-cuerpo)/1.3 var(--fuente);color:var(--c-acento-texto);margin:var(--e-1) 0 0}
.es-capitulo .pi-btn,.state:not([data-zoom-src]) .pi-btn{right:var(--margen)}
.solo-voz{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<style id="capa-sonido">
.cab-relato .son{all:unset;cursor:pointer;width:44px;height:44px;margin-right:-12px;display:grid;place-items:center;color:var(--c-texto)}
.cab-relato .son[aria-pressed="false"]{color:var(--c-apagado)}
.cover .activar-sonido{display:flex;align-items:center;justify-content:space-between;width:100%;height:var(--fila);margin-top:var(--e-3);
  padding:0 20px;background:var(--c-acento);color:#000;border:0;font:500 var(--t-cuerpo) var(--fuente);cursor:pointer}
.cover .activar-sonido[hidden]{display:none}
.cover .nota-sonido{margin:var(--e-1) 0 0;font-size:var(--t-dato);color:var(--c-apagado)}
.hablando{position:fixed;left:var(--margen);bottom:calc(var(--inf) + 10px);z-index:9992;font:var(--t-dato) var(--fuente);color:var(--c-apagado);
  display:flex;gap:8px;align-items:center;opacity:0;transition:opacity .3s;pointer-events:none}
.hablando.si{opacity:1}
.hablando i{display:block;width:3px;height:10px;background:var(--c-acento-texto);animation:onda 1s ease-in-out infinite}
.hablando i:nth-child(2){animation-delay:.2s}.hablando i:nth-child(3){animation-delay:.4s}
@keyframes onda{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1.2)}}
@media (prefers-reduced-motion:reduce){.hablando i{animation:none}}
</style>

<script>
gsap.registerPlugin(ScrollTrigger);

// momentum (inercia al soltar) configurable por story: valor 1..10 → divisor 6000..1500.
// Más alto = menos divisor = más "fling". 7 ≈ el valor validado original (~3000).
const _cfg = (window.STORY_DATA && window.STORY_DATA.config) || {};
const _mom = (typeof _cfg.momentum === 'number') ? _cfg.momentum : 7;
const _DIV = 1500 + (10 - _mom) * 500;
// ritmo del scroll: cuánto recorrido pide cada transición. pace 1..10, 5 = neutro (factor 1.0).
// Más alto = recorrido más corto = la story avanza más rápido con el mismo gesto.
const _pace = (typeof _cfg.pace === 'number') ? _cfg.pace : 5;
const _paceFactor = Math.max(0.4, 1.6 - _pace * 0.12);
// transición entre escenas: 'revelar' (por defecto, la del motor validado) o 'fundido' (en el sitio, sin desplazamiento)
const FUNDIDO = _cfg.transicion === 'fundido';
ScrollTrigger.normalizeScroll({
  type: "touch,wheel,pointer",
  momentum: self => Math.min(1, Math.abs(self.velocityY) / _DIV)
});

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const ICON_LINK='<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
const ICON_SHARE='<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"/></svg>';
const ICON_CHEV='<svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>';

// --- renderer: convierte el JSON en el DOM EXACTO que el motor ya espera ---
function renderStory(data){
  const root = document.getElementById('stage-root');
  const tagHTML = t => t ? `<span class="tag">${esc(t)}</span>` : '';
  function mediaInner(b, ambInCanvas){
    const m = b.media || {};
    const fit = b.fit || 'contain';
    const cover = fit === 'cover', wide = fit === 'wide';
    const finas = ambInCanvas || '';   // canvas de partículas finas, va DENTRO del sharp para recortarse a la foto
    let sharp = '';
    if (m.type === 'video'){
      const ofit = wide ? '' : 'object-fit:cover;';
      // el video no admite hijos: envolvemos para poder superponer las finas recortadas
      sharp = finas
        ? `<div class="sharp sharp-wrap"${wide?'':' style="aspect-ratio:auto"'}><video autoplay muted loop playsinline style="${ofit}width:100%;height:100%;${wide?'':'object-fit:cover;'}background:#2a4a44;"><source src="${esc(m.src)}" type="video/mp4"></video>${finas}</div>`
        : `<video class="sharp" autoplay muted loop playsinline style="${ofit}background:#2a4a44;"><source src="${esc(m.src)}" type="video/mp4"></video>`;
    } else if (m.type === 'image'){
      if (wide){
        // <img> no admite hijos: envolvemos en un div para poder superponer las finas
        sharp = finas
          ? `<div class="sharp sharp-wrap" style="aspect-ratio:auto"><img src="${esc(m.src)}" alt="" style="width:100%;height:auto;display:block">${finas}</div>`
          : `<img class="sharp" src="${esc(m.src)}" alt="">`;
      } else {
        sharp = `<div class="sharp" style="background-image:url('${esc(m.src)}');background-color:#222;">${tagHTML(m.tag)}${finas}</div>`;
      }
    } else {
      const wideAspect = wide ? 'aspect-ratio:16/10;' : '';
      sharp = `<div class="sharp" style="${wideAspect}background:${esc(m.color||'#8a6f4f')};">${tagHTML(m.tag)}${finas}</div>`;
    }
    let inner = '';
    if (!cover){ // contain Y a-lo-ancho llevan el desenfoque de fondo
      let blur = (m.type === 'image' && m.src) ? `background-image:url('${esc(m.src)}');`
               : (m.type === 'video') ? 'background:#1a2e2a;'
               : `background:${esc(m.color||'#8a6f4f')};`;
      inner += `<div class="blur-fill" style="${blur}"></div>`;
    }
    inner += sharp;
    if (cover) inner += `<div class="scrim"></div>`;
    return inner;
  }
  function captionsHTML(b){
    return (b.captions||[]).map(c=>{
      const z = c.zoom ? ` data-zoom-x="${c.zoom.x}" data-zoom-y="${c.zoom.y}" data-zoom-scale="${c.zoom.scale}"` : '';
      return `<div class="caption"${z}><p>${esc(c.text)}</p></div>`;
    }).join('').replace(/^/, '<div class="banda">') + '</div>';
  }
  const cov = data.cover || {};
  const shareRow = cov.share===false ? '' :
    `<div class="share"><button data-share="link" aria-label="Copiar enlace">${ICON_LINK}</button><button data-share="native" aria-label="Compartir">${ICON_SHARE}</button></div>`;
  const coverBg = cov.image
    ? `<div class="cover-bg${cov.effect==='zoom'?' zoom':''}" style="background-image:url('${esc(cov.image)}')"></div><div class="cover-overlay"></div>`
    : '';
  // color de fondo: si hay color definido, sobreescribe el degradado por defecto
  const coverStyle = cov.bgColor ? ` style="background:radial-gradient(120% 90% at 30% 20%, ${esc(cov.bgColor)}cc, ${esc(cov.bgColor)}22 70%)"` : '';
  // logo: imagen de institución arriba-izquierda, invertida a blanco sobre el fondo
  const coverLogo = cov.logo ? `<img class="cover-logo" src="${esc(cov.logo)}" alt="">` : '';
  const byline = cov.byline ? `<div class="byline">${esc(cov.byline)}</div>` : '';
  let html = `<div class="cover"${coverStyle}>${coverBg}${coverLogo}<div class="hero">${cov.kicker?`<div class="kicker">${esc(cov.kicker)}</div>`:''}<h1>${esc(cov.title)}</h1>${cov.subtitle?`<p class="sub">${esc(cov.subtitle)}</p>`:''}${shareRow}</div><div class="foot">${byline}<div class="down">${ICON_CHEV}</div></div></div>`;
  (data.blocks||[]).forEach((b,i)=>{
    if (b.type === 'custom'){ html += `<div class="state" data-index="${i}">${b.html||''}</div>`; return; }
    const fitClass = b.fit==='cover' ? ' fit-cover' : (b.fit==='wide' ? ' fit-wide' : '');
    const toneClass = (b.tone && b.tone!=='none') ? ' tone-'+b.tone : '';
    const aguaClass = b.bg === 'agua' ? ' bg-agua' : '';
    const ambOutClass = b.pOut ? ' has-amb-out' : '';
    const aguaStyle = (b.bg === 'agua' && typeof b.aguaBlur === 'number') ? ` style="--agua-blur:${b.aguaBlur}px"` : '';
    // pScale: escala de partículas según distancia de escena (near/mid/far)
    const pScaleAttr = ` data-pscale="${b.pScale||'near'}"`;
    // gruesas (amb-out): a pantalla completa del bloque, DETRÁS de la foto.
    const ambOut = b.pOut ? `<canvas class="ambient amb-out" data-amb="out"${pScaleAttr}></canvas>` : '';
    // finas (amb-in): van DENTRO del sharp (se recortan a la foto, no se salen).
    const ambIn  = b.pIn  ? `<canvas class="ambient amb-in"  data-amb="in"${pScaleAttr}></canvas>`  : '';
    // botón de zoom: ya no se renderiza por bloque — es un elemento fixed global
    // que syncActiveBlock muestra/oculta y actualiza con el src del bloque activo.
    const canZoom = b.zoomable && b.media && b.media.type==='image' && b.media.src;
    const zoomSrc = canZoom ? esc(b.media.src) : '';
    let infoHTML = '';
    if (b.pieceInfo) {
      const pi = b.pieceInfo;
      const fieldsHTML = (pi.fields||[]).map(f=>
        `<div class="pi-field"><span class="pi-label">${esc(f.name)}</span><span class="pi-value">${esc(f.value)}</span></div>`
      ).join('');
      infoHTML = `<button class="pi-btn" aria-label="Ver ficha de la pieza">ⓘ</button>
        <div class="pi-panel"><button class="pi-close" aria-label="Cerrar">✕</button>
          ${pi.title?`<div class="pi-name">${esc(pi.title)}</div>`:''}
          <div class="pi-fields">${fieldsHTML}</div>
        </div>`;
    }
    if (b.type === 'capitulo'){
      const c = b.capitulo || {};
      html += `<div class="state es-capitulo" data-index="${i}"><div class="state-media capitulo"><div class="cap-card">${c.kicker?`<div class="cap-kicker">${esc(c.kicker)}</div>`:''}<h2 class="cap-titulo">${esc(c.titulo)}</h2>${c.tema?`<p class="cap-tema">${esc(c.tema)}</p>`:''}</div></div>${captionsHTML(b).replace('<p>', `<p><span class="solo-voz">${esc(c.titulo)}. ${c.tema?esc(c.tema)+'. ':''}</span>`)}${infoHTML}</div>`;
      return;
    }
    html += `<div class="state" data-index="${i}"${zoomSrc?` data-zoom-src="${zoomSrc}"`:''}><div class="state-media${fitClass}${toneClass}${aguaClass}${ambOutClass}"${aguaStyle}>${ambOut}${mediaInner(b, ambIn)}</div>${captionsHTML(b)}${infoHTML}</div>`;
  });
  const cr = data.credits || {};
  const salida = (cr.links||[]).map(l=>`<a class="salida" href="${esc(l.href)}"><span>${esc(l.texto)}</span><svg class="ico" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.1" aria-hidden="true"><path d="M3 11h16"/><path d="M13 5.5 18.6 11 13 16.5"/></svg></a>`).join('');
  html += `<div class="credits"><h2>${esc(cr.heading||'Créditos')}</h2><p>${esc(cr.text)}</p>${salida?`<nav class="salidas">${salida}</nav>`:''}</div>`;
  const cfgR = data.config||{};
  const vol = document.getElementById('relatoVolver'); if(vol && cfgR.volver) vol.href = cfgR.volver;
  const mu = document.getElementById('relatoMuestra'); if(mu) mu.textContent = cfgR.muestra || cov.title || '';
  root.innerHTML = html;
}

// --- buildStory: COPIA LITERAL del motor validado (con guardas mínimas) ---
function buildStory(){
  const storyScroll = document.querySelector('.story-scroll');
  const coverEl     = document.querySelector('.cover');
  const stateEls    = [...document.querySelectorAll('.state')];
  const creditsEl   = document.querySelector('.credits');
  const debugEl     = document.querySelector('.debug');

  // La portada se va hacia arriba al empezar a hacer scroll, revelando la primera imagen
  // que ya está colocada debajo (patrón Google Arts & Culture). Para eso la portada va
  // por ENCIMA del primer estado al inicio; el resto de estados se apilan por debajo.
  coverEl.style.zIndex = stateEls.length + 2;
  stateEls.forEach((el, i) => { el.style.zIndex = stateEls.length - i + 1; });
  creditsEl.style.zIndex = 1;

  const stage = document.querySelector('.stage');
  const travelDist = stage.offsetHeight;            // distancia VISUAL: siempre la pantalla completa (para cubrir)
  const mediaTravelPx = stage.offsetHeight * _paceFactor;  // DURACIÓN de scroll de cada transición (ritmo)

  const tl = gsap.timeline({ paused:true });
  let t = 0;
  const phases = [];
  const addPhase = (label, d) => phases.push({ t0:t, t1:t+d, label });

  // 'revealAt' = el instante en que el estado SIGUIENTE debe colocarse en su sitio (y:0),
  // justo cuando el actual empieza a salir, para que quede detrás listo para revelarse.
  // Como todos los medios arrancan FUERA de pantalla, en scroll 0 solo se ve la portada:
  // ningún estado posterior asoma por encima de ella. Aquí estaba el bug.
  let revealAt = 0;

  stateEls.forEach((stateEl, i) => {
    const media    = stateEl.querySelector('.state-media');
    const captions = [...stateEl.querySelectorAll('.caption')];
    if (!media || captions.length === 0) return; // guarda: bloque custom incompleto no rompe la previa

    if (i === 0){
      // El primer media ya está en su sitio (y:0) desde el principio, debajo de la portada.
      // immediateRender:true lo coloca YA (gana al translateY(100dvh) del CSS, sin parpadeo).
      // En vez de subir la imagen, subimos la PORTADA para revelarla.
      gsap.set(media, {y:0});
      tl.set(media, {y:0}, 0);
      if (FUNDIDO){
        // sale la portada hasta el fondo de la muestra y después entra la primera imagen: nunca se mezclan
        tl.fromTo(coverEl, {opacity:1}, {opacity:0, duration:mediaTravelPx/2, ease:'none'}, t); tl.set(coverEl, {y:-travelDist}, t + mediaTravelPx/2);
        tl.fromTo(media, {opacity:0}, {opacity:1, duration:mediaTravelPx/2, ease:'none'}, t + mediaTravelPx/2);
      }
      else tl.fromTo(coverEl, {y:0}, {y:-travelDist, duration:mediaTravelPx, ease:'none'}, t);
      addPhase(`Portada · salida hacia arriba`, mediaTravelPx);
      t += mediaTravelPx;
    } else {
      // estado i≥1: sin entrada propia. Se coloca instantáneamente detrás del anterior en el
      // momento en que ÉSTE empieza a salir, y se revela al deslizarse el anterior hacia arriba.
      if (FUNDIDO) tl.fromTo(media, {y:0, opacity:0}, {opacity:1, duration:mediaTravelPx/2, ease:'none', immediateRender:false}, revealAt + mediaTravelPx/2);
      else tl.to(media, {y:0, duration:0.001, ease:'none', immediateRender:false}, revealAt);
    }

    const sharp = media.querySelector('.sharp');
    const CAMERA_MOVE_PX = 140 * _paceFactor;
    let currentCamera = { x:50, y:50, scale:1 };

    captions.forEach((cap, ci) => {
      const isLast = ci === captions.length - 1;
      const targetCamera = {
        x: cap.dataset.zoomX ? parseFloat(cap.dataset.zoomX) : 50,
        y: cap.dataset.zoomY ? parseFloat(cap.dataset.zoomY) : 50,
        scale: cap.dataset.zoomScale ? parseFloat(cap.dataset.zoomScale) : 1
      };
      const cameraChanged = targetCamera.x !== currentCamera.x || targetCamera.y !== currentCamera.y || targetCamera.scale !== currentCamera.scale;
      if (sharp && cameraChanged){
        const W = sharp.offsetWidth, H = sharp.offsetHeight, S = targetCamera.scale;
        const tx = (0.5 - targetCamera.x/100) * W * S;
        const ty = (0.5 - targetCamera.y/100) * H * S;
        tl.to(sharp, {x:tx, y:ty, scale:S, duration:CAMERA_MOVE_PX, ease:'none'}, t);
        addPhase(`Estado ${i+1} · cámara → x:${targetCamera.x} y:${targetCamera.y} zoom:${S}`, CAMERA_MOVE_PX);
        t += CAMERA_MOVE_PX;
        currentCamera = targetCamera;
      }
      const capH = cap.offsetHeight;
      if (FUNDIDO) tl.fromTo(cap, {y:0, opacity:0}, {opacity:1, duration:capH, ease:'none'}, t);
      else tl.fromTo(cap, {y:capH}, {y:0, duration:capH, ease:'none'}, t);
      addPhase(`Estado ${i+1} · entrada texto ${ci+1}/${captions.length}`, capH);
      t += capH;
      if (!isLast){
        if (FUNDIDO){ tl.to(cap, {opacity:0, duration:mediaTravelPx/2, ease:'none'}, t); tl.set(cap, {y:-travelDist}, t + mediaTravelPx/2); }
        else {
        tl.to(cap, {y:-travelDist, duration:mediaTravelPx, ease:'none'}, t);
        tl.to(cap, {opacity:0, duration:mediaTravelPx/2, ease:'none'}, t + mediaTravelPx/2);
        }
        addPhase(`Estado ${i+1} · fundido texto ${ci+1}/${captions.length}`, mediaTravelPx);
        t += mediaTravelPx;
      }
    });

    const lastCaption = captions[captions.length - 1];
    revealAt = t; // el siguiente estado (o los créditos) se coloca justo cuando éste empieza a salir
    if (FUNDIDO){
      // la escena se funde en su sitio y deja ver la siguiente, ya colocada detrás
      // primera mitad: la escena se funde hasta el fondo; segunda mitad: entra la siguiente
      tl.to([media, lastCaption], {opacity:0, duration:mediaTravelPx/2, ease:'none'}, t);
      tl.set([media, lastCaption], {y:-travelDist}, t + mediaTravelPx/2);
    } else {
    tl.to(media,       {y:-travelDist, duration:mediaTravelPx, ease:'none'}, t);
    tl.to(lastCaption, {y:-travelDist, duration:mediaTravelPx, ease:'none'}, t);
    }
    addPhase(`Estado ${i+1} · salida de bloque`, mediaTravelPx);
    t += mediaTravelPx;
  });

  // los créditos arrancan también fuera de pantalla y se revelan cuando el último estado sale
  if (FUNDIDO) tl.fromTo(creditsEl, {y:0, opacity:0}, {opacity:1, duration:mediaTravelPx/2, ease:'none', immediateRender:false}, revealAt + mediaTravelPx/2);
  else tl.to(creditsEl, {y:0, duration:0.001, ease:'none', immediateRender:false}, revealAt);

  const totalPx = t;
  storyScroll.style.height = (totalPx + mediaTravelPx) + 'px';

  let _ambTick=false;
  ScrollTrigger.create({
    animation: tl, trigger: storyScroll, start: 'top top', end: 'bottom bottom', scrub: true,
    onUpdate(self){
      const pb=document.getElementById('progBar'); if(pb) pb.style.transform='scaleX('+self.progress+')';
      if(typeof syncAmbientVisibility==='function' && !_ambTick){ _ambTick=true; requestAnimationFrame(()=>{ syncAmbientVisibility(); _ambTick=false; }); }
      if (!debugEl) return;
      const tNow = self.progress * totalPx;
      const phase = phases.find(p => tNow >= p.t0 && tNow < p.t1);
      debugEl.textContent = phase ? phase.label : (tNow <= 0 ? 'Portada' : 'Créditos');
    }
  });
  if (debugEl) debugEl.textContent = 'Portada';

  document.querySelectorAll('video.sharp').forEach(v => {
    v.muted = true;
    v.play().catch(()=>{});
  });
}

function shareToast(msg){ const el=document.getElementById('shareToast'); if(!el) return; el.textContent=msg; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),1800); }
function wireShare(){
  const cov = (window.STORY_DATA && window.STORY_DATA.cover) || {};
  document.querySelectorAll('[data-share]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const payload = { title: cov.title || document.title, url: location.href };
      if (btn.dataset.share==='native' && navigator.share){ try{ await navigator.share(payload); }catch(e){} return; }
      try{ await navigator.clipboard.writeText(payload.url); shareToast('Enlace copiado'); }
      catch(e){ shareToast('Copia el enlace desde la barra'); }
    });
  });
}

function initInfoBtns(){
  // el botón ⓘ y el panel de ficha viven dentro de .state, que está en .stage
  document.querySelector('.stage').addEventListener('click', e=>{
    if(e.target.classList.contains('pi-btn')){
      e.stopPropagation();
      const panel=e.target.nextElementSibling;
      if(panel) panel.classList.toggle('open');
    } else if(e.target.classList.contains('pi-close')){
      e.stopPropagation();
      e.target.closest('.pi-panel').classList.remove('open');
    }
  });
}

/* =============================================================
   PARTÍCULAS EN SUSPENSIÓN — canvas 2D, globalCompositeOperation:'lighter'.
   El blending aditivo hace que donde se solapan se sumen → destellos
   bioluminiscentes, sin Pixi ni WebGL. ~45 líneas.
   ============================================================= */
const AMBIENT = {
  in:  { count:90,  rMin:0.5, rMax:2.0, vy:-0.06, vyVar:0.08, sway:0.14, alpha:0.55, tint:[190,245,255] },
  out: { count:55,  rMin:1.2, rMax:4.5, vy:-0.18, vyVar:0.14, sway:0.28, alpha:0.30, tint:[160,230,255] }
};
const _ambFields=[], _reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;

function initAmbient(){
  document.querySelectorAll('canvas.ambient').forEach(cv=>{
    const cfg=AMBIENT[cv.dataset.amb]||AMBIENT.out;
    const f={canvas:cv,ctx:cv.getContext('2d'),parts:[],cfg,raf:0,running:false,sized:false};
    sizeAmbient(f); seedAmbient(f); _ambFields.push(f);
  });
  window.addEventListener('resize',()=>_ambFields.forEach(f=>{sizeAmbient(f);seedAmbient(f);}));
}
function sizeAmbient(f){
  const host=f.canvas.parentElement||{};
  let w=f.canvas.offsetWidth||host.offsetWidth||window.innerWidth;
  let h=f.canvas.offsetHeight||host.offsetHeight||window.innerHeight;
  if(f.cfg===AMBIENT.out){w=Math.max(w,window.innerWidth);h=Math.max(h,window.innerHeight);}
  const dpr=Math.min(window.devicePixelRatio||1,2);
  f.canvas.width=Math.max(1,Math.round(w*dpr));
  f.canvas.height=Math.max(1,Math.round(h*dpr));
  f.dpr=dpr;
}
function seedAmbient(f){
  const W=f.canvas.width, H=f.canvas.height, c=f.cfg;
  // multiplicador de escala según distancia de escena:
  // near=primer plano (tamaño y densidad completos)
  // mid=plano medio (partículas más pequeñas y menos densas)
  // far=plano general (muy sutiles, casi sugeridas)
  const ps = f.canvas.dataset.pscale || 'near';
  const sizeM  = ps==='far' ? 0.30 : ps==='mid' ? 0.55 : 1.0;
  const countM = ps==='far' ? 0.25 : ps==='mid' ? 0.50 : 1.0;
  const count  = Math.max(4, Math.round(c.count * countM));
  f.parts=[];
  for(let i=0;i<count;i++) f.parts.push({
    x:Math.random()*W, y:Math.random()*H,
    r:(c.rMin+Math.random()*(c.rMax-c.rMin))*f.dpr*sizeM,
    vy:(c.vy-Math.random()*c.vyVar)*f.dpr,
    sway:Math.random()*Math.PI*2, swaySpeed:0.003+Math.random()*0.012,
    a:c.alpha*(0.4+Math.random()*0.6)
  });
}
const _sprites={};  // cache de sprites por perfil
function makeSprite(cfg){
  const S=48, cv=document.createElement('canvas'); cv.width=cv.height=S;
  const g=cv.getContext('2d');
  const [r,gb,b]=cfg.tint, cx=S/2;
  const grd=g.createRadialGradient(cx,cx,0,cx,cx,cx);
  grd.addColorStop(0,  `rgba(${r},${gb},${b},1)`);
  grd.addColorStop(0.4,`rgba(${r},${gb},${b},0.5)`);
  grd.addColorStop(1,  `rgba(${r},${gb},${b},0)`);
  g.fillStyle=grd; g.fillRect(0,0,S,S);
  return cv;
}
function drawAmbient(f){
  const {ctx,canvas,cfg}=f, W=canvas.width, H=canvas.height;
  const key=f.canvas.dataset.amb;
  if(!_sprites[key]) _sprites[key]=makeSprite(cfg);
  const sp=_sprites[key];
  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  for(const p of f.parts){
    p.sway+=p.swaySpeed; p.x+=Math.sin(p.sway)*cfg.sway*f.dpr; p.y+=p.vy;
    if(p.y<-p.r*3){p.y=H+p.r; p.x=Math.random()*W;}
    if(p.x<-p.r) p.x=W+p.r; else if(p.x>W+p.r) p.x=-p.r;
    const breathe=0.65+0.35*Math.sin(p.sway*0.6), d=p.r*3;
    ctx.globalAlpha=p.a*breathe;
    ctx.drawImage(sp, p.x-d, p.y-d, d*2, d*2);
  }
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
}
function runAmbient(f){if(f.running||_reduce)return;f.running=true;const loop=()=>{if(!f.running)return;drawAmbient(f);f.raf=requestAnimationFrame(loop);};loop();}
function stopAmbient(f){f.running=false;if(f.raf)cancelAnimationFrame(f.raf);}
function syncAmbientVisibility(){
  const vh=window.innerHeight;
  _ambFields.forEach(f=>{
    const r=f.canvas.getBoundingClientRect(), visible=r.top<vh*0.95&&r.bottom>vh*0.05;
    if(visible){
      if(!f.sized||f.canvas.width<10||f.canvas.height<10){sizeAmbient(f);seedAmbient(f);f.sized=true;}
      runAmbient(f);
    } else stopAmbient(f);
  });
  syncActiveBlock();
}
function syncActiveBlock(){
  const vh = window.innerHeight, cy = vh/2;
  let best=null, bestArea=-1;
  document.querySelectorAll('.state').forEach(st=>{
    const media = st.querySelector('.state-media');
    if(!media) return;
    const r = media.getBoundingClientRect();
    if(r.top <= cy && r.bottom >= cy){
      const area = Math.min(r.bottom,vh) - Math.max(r.top,0);
      if(area>bestArea){ bestArea=area; best=st; }
    }
  });
  document.querySelectorAll('.state.block-active').forEach(st=>{ if(st!==best) st.classList.remove('block-active'); });
  if(best) best.classList.add('block-active');
  // botón de zoom global: visible solo si el bloque activo tiene imagen zoomable
  const btn = document.getElementById('zoomGlobalBtn');
  if(btn){
    const src = best ? best.dataset.zoomSrc : '';
    if(src){ btn.dataset.zoomSrc=src; btn.classList.add('visible'); }
    else { btn.classList.remove('visible'); }
  }
  if (typeof window.sonidoSync === 'function') window.sonidoSync(best);
}

/* =============================================================
   VISOR DE ZOOM — pellizco + arrastre, CSS transforms puros.
   Para imágenes de stock normales (no gigapíxeles): sin tiles,
   sin pretratamiento, sin dependencias. Sigue siendo standalone.
   ============================================================= */
function initZoom(){
  const viewer = document.getElementById('zoomViewer');
  if(!viewer) return;
  const img = viewer.querySelector('img');
  const hint = document.getElementById('zoomHint');

  let scale=1, tx=0, ty=0, minScale=1; const maxScale=6;
  let startDist=0, startScale=1; let panStart=null; let lastTap=0;

  function apply(){ img.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }
  function clamp(){
    const vw=window.innerWidth, vh=window.innerHeight;
    const iw=img.naturalWidth*minScale*scale, ih=img.naturalHeight*minScale*scale;
    const mx=Math.max(0,(iw-vw)/2), my=Math.max(0,(ih-vh)/2);
    tx=Math.max(-mx,Math.min(mx,tx)); ty=Math.max(-my,Math.min(my,ty));
  }
  function fit(){
    const vw=window.innerWidth, vh=window.innerHeight;
    minScale = Math.max(vw/img.naturalWidth, vh/img.naturalHeight); // cover
    img.style.width = (img.naturalWidth*minScale)+'px';
    img.style.height= (img.naturalHeight*minScale)+'px';
    scale=1; tx=0; ty=0; apply();
  }
  function intro(){
    // arranca un poco alejada y se acerca al encuadre real (acerca + aparece a la vez)
    img.classList.remove('intro');
    img.style.transform = 'translate(0px,0px) scale(0.86)';
    // forzar reflow para que la transición se aplique desde el estado inicial
    void img.offsetWidth;
    img.classList.add('intro');
    requestAnimationFrame(()=>{ scale=1; tx=0; ty=0; apply(); });
    setTimeout(()=>img.classList.remove('intro'), 600);
  }
  function openZoomViewer(src){
    img.onload=()=>{ fit(); intro(); };
    img.src = src;
    if(img.complete && img.naturalWidth){ fit(); intro(); }
    viewer.classList.add('open');
    requestAnimationFrame(()=>viewer.classList.add('fade'));   // fundido del fondo
    if(hint){ hint.style.opacity='1'; setTimeout(()=>{ hint.style.opacity='0'; }, 2600); }
    document.body.style.overflow='hidden';
  }
  function closeZoomViewer(){ viewer.classList.remove('fade'); document.body.style.overflow=''; setTimeout(()=>{ viewer.classList.remove('open'); img.src=''; }, 300); }

  const globalBtn = document.getElementById('zoomGlobalBtn');
  if(globalBtn) globalBtn.addEventListener('click', ()=>{
    const src = globalBtn.dataset.zoomSrc;
    if(src) openZoomViewer(src);
  });
  document.getElementById('zoomExit').addEventListener('click', closeZoomViewer);

  const dist=(a,b)=>Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);

  viewer.addEventListener('touchstart', e=>{
    if(e.touches.length===2){ startDist=dist(e.touches[0],e.touches[1]); startScale=scale; }
    else if(e.touches.length===1){ panStart={x:e.touches[0].clientX-tx, y:e.touches[0].clientY-ty}; }
  }, {passive:true});
  viewer.addEventListener('touchmove', e=>{
    if(e.touches.length===2){
      e.preventDefault();
      const d=dist(e.touches[0],e.touches[1]);
      scale=Math.max(1, Math.min(maxScale, startScale*(d/startDist)));
      clamp(); apply();
    } else if(e.touches.length===1 && panStart){
      e.preventDefault();
      tx=e.touches[0].clientX-panStart.x; ty=e.touches[0].clientY-panStart.y;
      clamp(); apply();
    }
  }, {passive:false});
  viewer.addEventListener('touchend', e=>{
    if(e.touches.length===0) panStart=null;
    const now=Date.now();
    if(now-lastTap<300){ scale = scale>1.2 ? 1 : 2.5; tx=0; ty=0; clamp(); apply(); }
    lastTap=now;
  }, {passive:true});
  viewer.addEventListener('wheel', e=>{ e.preventDefault(); scale=Math.max(1,Math.min(maxScale, scale - e.deltaY*0.002)); clamp(); apply(); }, {passive:false});
}

function init(){
  if (!window.SHOW_HUD){ const d=document.querySelector('.debug'); if(d) d.remove(); }
  renderStory(window.STORY_DATA || {});
  wireShare();
  initInfoBtns();
  initZoom();
  // CLAVE: medir SOLO cuando las fuentes ya han cargado. Una webfont que carga después
  // cambiaría la altura de las captions y rompería el 1:1. Con fuente de sistema, resuelve al instante.
  const go = ()=>requestAnimationFrame(()=>{
    buildStory();
    initAmbient();          // mide los canvas ya con su tamaño final
    syncAmbientVisibility();
  });
  if (document.fonts && document.fonts.ready){ document.fonts.ready.then(go); } else { go(); }
}
window.addEventListener('load', init);
</script>

<script id="modulo-sonido">
/* ================================================================
   MÓDULO DE SONIDO · dos canales
   Fondo: ambiente en bucle por story o por escena, con fundido cruzado.
   Voz: una cápsula por texto, que suena cuando el texto se queda en pantalla.
   Mientras habla la voz, el fondo baja (ducking) y vuelve a subir al callar.
   Prototipo: el fondo se genera por código y la voz es la del móvil.
   En producción, ambos serán ficheros de audio preparados al montar la muestra.
   ================================================================ */
(function(){
  const CFG = (window.STORY_DATA.config||{}).sonido || {};
  const BLOQUES = window.STORY_DATA.blocks || [];
  const BASE = 0.32, REDUCCION = (typeof CFG.reduccion==='number') ? CFG.reduccion : 0.25;
  let ctx=null, master=null, ducker=null, activo=false;
  const fondos={}; let fondoActual=null;
  let textoActual=null, temporizador=null, hablando=false;

  /* ---------- fondos generados ---------- */
  function ruido(seg){
    const b=ctx.createBuffer(2, ctx.sampleRate*seg, ctx.sampleRate);
    for(let c=0;c<2;c++){ const d=b.getChannelData(c); let ult=0;
      for(let i=0;i<d.length;i++){ const w=Math.random()*2-1; ult=(ult+0.02*w)/1.02; d[i]=ult*3.5*0.6+w*0.4; } }
    return b;
  }
  function crearHojarasca(){
    const salida=ctx.createGain(); salida.gain.value=0;
    const src=ctx.createBufferSource(); src.buffer=ruido(6); src.loop=true;
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2200; bp.Q.value=.6;
    const g=ctx.createGain(); g.gain.value=.35;
    const lfo=ctx.createOscillator(); lfo.frequency.value=.13; const lg=ctx.createGain(); lg.gain.value=.18;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    src.connect(bp); bp.connect(g); g.connect(salida); src.start();
    // crujidos sueltos: semillas y hojas secas
    const corto=ctx.createBuffer(1, ctx.sampleRate*.06, ctx.sampleRate);
    { const d=corto.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(d.length*.18)); }
    const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2800; hp.connect(salida);
    (function crujido(){
      if(salida._parar) return;
      if(salida.gain.value>0.01){
        const n=ctx.createBufferSource(); n.buffer=corto; n.playbackRate.value=.7+Math.random()*.9;
        const gg=ctx.createGain(); gg.gain.value=.08+Math.random()*.22;
        const pan=ctx.createStereoPanner? ctx.createStereoPanner():null;
        n.connect(gg); if(pan){ pan.pan.value=Math.random()*1.6-.8; gg.connect(pan); pan.connect(hp); } else gg.connect(hp);
        n.start();
      }
      setTimeout(crujido, 70+Math.random()*420);
    })();
    salida.connect(ducker); return salida;
  }
  function crearAire(){
    const salida=ctx.createGain(); salida.gain.value=0;
    const src=ctx.createBufferSource(); src.buffer=ruido(8); src.loop=true;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=700; lp.Q.value=1.2;
    const lfo=ctx.createOscillator(); lfo.frequency.value=.06; const lg=ctx.createGain(); lg.gain.value=380;
    lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    const g=ctx.createGain(); g.gain.value=.9;
    src.connect(lp); lp.connect(g); g.connect(salida); src.start();
    salida.connect(ducker); return salida;
  }
  const GENERADORES={hojarasca:crearHojarasca, aire:crearAire};

  function ponerFondo(nombre){
    if(!ctx || nombre===fondoActual) return;
    const t=ctx.currentTime;
    if(fondoActual && fondos[fondoActual]){ const g=fondos[fondoActual].gain; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.linearRampToValueAtTime(0,t+1.5); }
    fondoActual=nombre;
    if(!nombre || nombre==='silencio') return;
    if(!fondos[nombre] && GENERADORES[nombre]) fondos[nombre]=GENERADORES[nombre]();
    if(fondos[nombre]){ const g=fondos[nombre].gain; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.linearRampToValueAtTime(BASE,t+1.5); }
  }
  function duck(abajo){
    if(!ducker) return; const t=ctx.currentTime, g=ducker.gain;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value,t);
    g.linearRampToValueAtTime(abajo?REDUCCION:1, t+(abajo?.4:1.2));
  }

  /* ---------- voz ---------- */
  let vozES=null;
  function elegirVoz(){
    const vs=speechSynthesis.getVoices();
    vozES = vs.find(v=>/^es[-_]ES/i.test(v.lang) && /monica|mónica|paulina|google|lucia|lucía|elvira/i.test(v.name))
         || vs.find(v=>/^es[-_]ES/i.test(v.lang)) || vs.find(v=>/^es/i.test(v.lang)) || null;
  }
  if('speechSynthesis' in window){ elegirVoz(); speechSynthesis.onvoiceschanged=elegirVoz; }
  const marca=document.createElement('div'); marca.className='hablando'; marca.innerHTML='<i></i><i></i><i></i><span>Voz</span>';
  document.body.appendChild(marca);
  function callar(){
    clearTimeout(temporizador);
    if('speechSynthesis' in window) speechSynthesis.cancel();
    if(hablando){ hablando=false; duck(false); marca.classList.remove('si'); }
  }
  function decir(texto){
    if(!('speechSynthesis' in window) || CFG.voz===false) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(texto);
    u.lang='es-ES'; if(vozES) u.voice=vozES; u.rate=.95;
    u.onstart=()=>{ hablando=true; duck(true); marca.classList.add('si'); };
    u.onend=u.onerror=()=>{ if(textoActual===texto){ hablando=false; marca.classList.remove('si'); setTimeout(()=>{ if(!hablando) duck(false); },300); } };
    speechSynthesis.speak(u);
  }

  /* ---------- sincronía con el scroll ---------- */
  window.sonidoSync = function(best){
    if(!activo) return;
    let fondo = CFG.fondo || null, texto = null;
    const enCreditos = !best && window.scrollY > 200;
    if(best){
      const b = BLOQUES[+best.dataset.index] || {};
      if(b.sonido && b.sonido.fondo) fondo = b.sonido.fondo;
      let max=.5;
      best.querySelectorAll('.caption').forEach(c=>{ const o=parseFloat(getComputedStyle(c).opacity); if(o>max){ max=o; texto=c.textContent.trim(); } });
    }
    ponerFondo(enCreditos ? null : fondo);
    if(texto!==textoActual){
      textoActual=texto; callar();
      if(texto) temporizador=setTimeout(()=>{ if(textoActual===texto) decir(texto); }, 450);
    }
  };

  /* ---------- activar y silenciar ---------- */
  function activar(){
    if(!ctx){
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain(); master.gain.value=1; master.connect(ctx.destination);
      ducker=ctx.createGain(); ducker.gain.value=1; ducker.connect(master);
      try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
    }
    ctx.resume();
    // desbloqueo de la voz en iOS: hay que hablar dentro del gesto
    if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); }
    activo=true; pintarBotones();
    fondoActual=null; textoActual=null;
    window.sonidoSync(document.querySelector('.state.block-active'));
    if(!document.querySelector('.state.block-active')) ponerFondo(CFG.fondo);
  }
  function silenciar(){
    activo=false; callar(); textoActual=null;
    if(ctx){ ponerFondo(null); }
    pintarBotones();
  }
  const ICO_ON='<svg class="ico" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M3 8.5h3.5L11 5v12l-4.5-3.5H3z"/><path d="M14 8.2a4 4 0 0 1 0 5.6M16.3 6a7 7 0 0 1 0 10"/></svg>';
  const ICO_OFF='<svg class="ico" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M3 8.5h3.5L11 5v12l-4.5-3.5H3z"/><path d="M14.5 8.5l5 5M19.5 8.5l-5 5"/></svg>';
  let btnCab, btnPortada, notaPortada;
  function pintarBotones(){
    if(btnCab){ btnCab.innerHTML = activo?ICO_ON:ICO_OFF; btnCab.setAttribute('aria-pressed',String(activo)); btnCab.setAttribute('aria-label', activo?'Silenciar':'Activar sonido'); }
    if(btnPortada){ btnPortada.hidden = activo; if(notaPortada) notaPortada.textContent = activo ? 'Sonido activado. Puedes silenciarlo arriba a la derecha.' : 'Mejor con auriculares. Puedes leerla también en silencio.'; }
  }
  function montarBotones(){
    const cab=document.querySelector('.cab-relato');
    if(cab && !btnCab){ btnCab=document.createElement('button'); btnCab.className='son'; cab.appendChild(btnCab);
      btnCab.addEventListener('click',()=> activo?silenciar():activar()); }
    const hero=document.querySelector('.cover .hero');
    if(hero && !btnPortada){
      btnPortada=document.createElement('button'); btnPortada.className='activar-sonido';
      btnPortada.innerHTML='<span>Escuchar con sonido</span>'+ICO_ON; hero.appendChild(btnPortada);
      notaPortada=document.createElement('p'); notaPortada.className='nota-sonido'; hero.appendChild(notaPortada);
      btnPortada.addEventListener('click',activar);
    }
    pintarBotones();
  }
  window.addEventListener('load',()=>setTimeout(montarBotones,0));
  document.addEventListener('visibilitychange',()=>{ if(document.hidden && activo) silenciar(); });
})();
</script>
</body></html>
