# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Hello Heritage · prompts de piezas

prompts:
  - id: file://versiones/construir.js:personaje
    label: personaje
  - id: file://versiones/construir.js:hibrido
    label: hibrido
  - id: file://versiones/construir.js:mediador
    label: mediador
  - id: file://versiones/construir.js:reglamento
    label: reglamento

# Misma temperatura y mismo tope para todos, para comparar prompts y no azar.
providers:
  - id: anthropic:messages:claude-sonnet-5-5
    label: claude-sonnet-5-5
    config:
      temperature: 0.7
      max_tokens: 600
  - id: anthropic:messages:claude-haiku-5-5
    label: claude-haiku-5-5
    config:
      temperature: 0.7
      max_tokens: 600
  # Para añadir otros, quita el «#» y comprueba el nombre exacto del modelo
  # en la web de cada proveedor:
  # - id: openai:chat:NOMBRE-DEL-MODELO
  #   label: openai
  #   config:
  #     temperature: 0.7
  #     max_tokens: 600
  # - id: google:NOMBRE-DEL-MODELO
  #   label: gemini
  #   config:
  #     temperature: 0.7
  #     maxOutputTokens: 600

defaultTest:
  vars:
    pieza: alberti-polvorista
  assert:
    # Aviso, no juicio: marca las respuestas de más de 80 palabras.
    - type: javascript
      value: output.trim().split(/\s+/).length <= 80
      metric: breve

tests: file://piezas/alberti-polvorista/visitas.yaml
