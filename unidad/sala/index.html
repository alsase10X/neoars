<!DOCTYPE html>
<html lang="es" data-adn-registro="inmersivo">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="../../adn/adn.css">
<title>artmedium en sala</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500&display=swap" rel="stylesheet">
<style>
/* artmedium · versión en sala. El visitante tiene la obra delante, así que la pantalla no la repite:
   la voz y el texto ocupan todo, y un sello redondo con la obra se acerca al detalle que se nombra.
   ADN de artmedium, registro inmersivo (solo oscuro): fondo con el color de la propia obra,
   una sola familia (Archivo), esquinas rectas salvo el sello, nada por debajo de 12 px. */
:root{
  color-scheme:dark;
  --bg:var(--c-fondo,#0A0A0B); --fg:var(--c-texto,#F6F5F2); --muted:var(--c-apagado,#A29E97); --hair:var(--c-filete,rgba(246,245,242,.2)); --panel:var(--c-panel,#0D0D0E); --tinta:#000;
  --acento:var(--fg); --sobre-acento:var(--tinta); --fuente-titulos:var(--font); --peso-titulos:900; --peso-titulos-2:800; --track-titulos:-.035em;
  --font:var(--fuente,"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif);
  --col:560px; --sello:clamp(118px,34vw,164px);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Tema claro (una marca, o la calle a pleno sol): el mismo sistema con otros valores. El fondo sigue saliendo de la obra */
:root[data-tema=claro]{color-scheme:light;--bg:#F6F4EF;--fg:#141414;--muted:#66625B;--hair:rgba(20,20,20,.16);--panel:#FFFFFF;--tinta:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.2;font-size:16px}
button,input{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--fg);outline-offset:-3px}
.col{width:100%;max-width:calc(var(--col) + 32px);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{position:relative;height:100%;overflow:hidden}
.vista{position:absolute;inset:0;overflow:hidden;background:var(--bg)}
.fondo{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(34px) brightness(.34) saturate(1.15);transform:translateZ(0);transition:filter 1s}

/* ---------- La sala (solo si se entra sin código de obra) ---------- */
#salaF{filter:blur(40px) brightness(.26) saturate(1.1)}
.salaIn{position:relative;height:100%;overflow-y:auto;padding-block:28px}
.eyb{font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(2.1rem,9vw,3.1rem);font-family:var(--fuente-titulos);font-weight:var(--peso-titulos);letter-spacing:var(--track-titulos);line-height:1;margin:12px 0 14px;text-wrap:balance;max-width:14ch}
.salaD{font-size:1.06rem;line-height:1.45;color:color-mix(in srgb,var(--fg) 86%,transparent);max-width:36ch}
.salaMenu{position:absolute;z-index:2;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(6px,env(safe-area-inset-right,0px));margin:0}
.salaFirma{margin-top:22px}
/* En la calle: lugar, selector Lista/Mapa, distancia y el mapa propio (fondo de OpenFreeMap invertido a oscuro) */
.salaL{margin-bottom:-2px}
.vistaSel{margin-top:22px;max-width:240px}
.cerca{font-size:.9rem;line-height:1.4;color:var(--muted);margin-top:14px;min-height:1.4em}
.cerca .lk{font-size:.9rem;padding:0;color:var(--fg)}
.ob .dist{color:var(--fg);font-weight:700}
#salaV.enMapa .salaIn{overflow:hidden}
#salaV.enMapa .obras,#salaV.enMapa .salaFirma{display:none}
.mapa{position:absolute;left:0;right:0;bottom:0;z-index:1;background:var(--panel);border-top:1px solid var(--hair)}
#mapaC{position:absolute;inset:0}
#mapaC .maplibregl-canvas{filter:invert(1) hue-rotate(180deg) saturate(.3) brightness(.92) contrast(.95)}
#mapaC .maplibregl-ctrl-attrib{background:color-mix(in srgb,var(--bg) 75%,transparent);color:var(--muted)}
#mapaC .maplibregl-ctrl-attrib a{color:var(--muted)}
.mk{width:46px;height:46px;border-radius:50%;border:2px solid var(--fg);background:#1a1a1b center/cover no-repeat;box-shadow:0 6px 18px rgba(0,0,0,.6);padding:0}
.mk b{position:absolute;right:-7px;top:-7px;min-width:21px;height:21px;padding:0 5px;border-radius:11px;background:var(--fg);color:var(--tinta);font-size:.75rem;font-weight:900;display:grid;place-items:center}
.mk.sel{width:58px;height:58px;border-width:3px}
.mk.aqui{box-shadow:0 0 0 5px color-mix(in srgb,var(--fg) 35%,transparent),0 6px 18px rgba(0,0,0,.6)}
.yo{width:18px;height:18px;border-radius:50%;background:#3d8bfd;border:3px solid #fff;box-shadow:0 0 0 7px rgba(61,139,253,.25)}
.mcard{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;background:var(--panel);border:1px solid var(--hair);box-shadow:0 18px 50px rgba(0,0,0,.65);padding:12px;display:grid;grid-template-columns:56px 1fr;gap:10px 12px;align-items:center}
.mcard img{width:56px;height:56px;border-radius:50%;object-fit:cover;display:block;max-width:none}
.mcard b{display:block;font-size:1.05rem;font-family:var(--fuente-titulos);font-weight:var(--peso-titulos-2);line-height:1.2}
.mcard small{display:block;font-size:.85rem;color:var(--muted);margin-top:3px;line-height:1.3}
.mcard small.dist{color:var(--fg);font-weight:700}
.mcard .acc{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.mcard .acc a,.mcard .acc button{height:44px;padding:0 14px;border:1px solid var(--hair);display:inline-flex;align-items:center;font-size:.92rem;font-weight:700;text-decoration:none}
.mcard .acc .pri{background:var(--acento);color:var(--sobre-acento);border-color:var(--acento)}
.obras{list-style:none;border-top:1px solid var(--hair);margin-top:24px}
.ob{display:grid;grid-template-columns:26px 64px 1fr 20px;gap:14px;align-items:center;width:100%;padding:14px 0;border-bottom:1px solid var(--hair);text-align:left}
.ob img{width:64px;height:64px;object-fit:cover;display:block;max-width:none;border-radius:50%}
.num{font-size:1.35rem;font-weight:900;font-variant-numeric:tabular-nums}
.obt{min-width:0}
.obt b{display:block;font-size:1.12rem;font-family:var(--fuente-titulos);font-weight:var(--peso-titulos-2);letter-spacing:-.01em;line-height:1.2}
.obt small{display:block;font-size:.85rem;color:var(--muted);margin-top:4px;line-height:1.3}
.ob .fl{font-weight:700;color:var(--muted)}
.ob:hover .obt b{text-decoration:underline;text-underline-offset:3px}
.pie{font-size:.8rem;line-height:1.5;color:var(--muted);margin-top:22px}
.pie b,.firma b{color:var(--fg);font-weight:900;letter-spacing:-.01em}

/* ---------- La obra ---------- */
.o-in{position:relative;height:100%;display:flex;flex-direction:column}
.top{flex:none;border-bottom:1px solid var(--hair);position:relative;z-index:3}
.top .col{display:flex;align-items:center;gap:8px;min-height:70px;padding-block:10px}
.who{flex:1;min-width:0}
.who b{display:block;font-size:1.18rem;font-family:var(--fuente-titulos);font-weight:var(--peso-titulos);letter-spacing:-.015em;line-height:1.15}
.who small{display:block;font-size:.9rem;color:color-mix(in srgb,var(--fg) 80%,transparent);margin-top:3px}
.ib{width:44px;height:44px;display:grid;place-items:center;flex:none;margin-right:-10px}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.ib:hover{background:var(--fg);color:var(--tinta)}
.ib.atras{margin-right:0;margin-left:-10px}

/* Inicio: el sello grande y un solo botón (el toque que deja sonar la voz) */
#inicio{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding-block:20px;text-align:center}
.ini-s{width:min(62vw,260px);aspect-ratio:1;max-width:100%;border-radius:50%;overflow:hidden;border:3px solid var(--fg);box-shadow:0 24px 70px rgba(0,0,0,.55)}
.ini-s img{width:100%;height:100%;object-fit:cover;display:block;max-width:none}
.ini-q{font-size:.95rem;color:color-mix(in srgb,var(--fg) 82%,transparent);line-height:1.4;max-width:30ch}
#empezar{height:56px;padding:0 26px;background:var(--acento);color:var(--sobre-acento);font-size:1.02rem;font-weight:800;display:flex;align-items:center;gap:10px}
#empezar svg{width:16px;height:16px;fill:currentColor}
#obraV.conversa #empezar svg{display:none}

/* El relato y la conversación, como un solo texto que crece hacia abajo */
#flujo{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(transparent,#000 22px,#000 60%,transparent 97%);mask-image:linear-gradient(transparent,#000 22px,#000 60%,transparent 97%);transition:opacity .8s}
#flujo::-webkit-scrollbar{display:none}
#lineas{display:flex;flex-direction:column;gap:22px;padding-block:24px calc(var(--sello)*.55 + 70px)}
.cap{font-size:clamp(1.32rem,5.5vw,1.62rem);font-weight:700;letter-spacing:-.014em;line-height:1.36;max-width:30ch;transition:opacity .6s;animation:entra .6s cubic-bezier(.2,.8,.2,1)}
@keyframes entra{from{opacity:0;transform:translateY(12px)}}
.cap.ya,.ans.ya{opacity:.4}
.cap p+p,.cap p+div,.cap div+p{margin-top:.5em}
.cap.preg{font-size:clamp(1.55rem,6.6vw,1.95rem);font-weight:800;letter-spacing:-.025em;line-height:1.16}
blockquote{font-style:italic;font-weight:500;border-left:2px solid currentColor;padding-left:12px}
.ref{font-size:.85rem;font-weight:500;font-style:normal;color:var(--muted);line-height:1.35;margin-top:8px;letter-spacing:0}
.ref a{text-decoration:underline;text-underline-offset:2px}
.w{transition:opacity .25s}
#obraV.sonando .cap.ahora .w{opacity:.28}
#obraV.sonando .cap.ahora .w.on{opacity:1}
.you{font-size:1rem;font-style:italic;font-weight:500;color:var(--muted);line-height:1.4;max-width:34ch;margin-bottom:-8px}
.qn{font-size:.85rem;font-weight:800;margin-bottom:-10px}
.ans{font-size:clamp(1.24rem,5vw,1.48rem);font-weight:600;line-height:1.4;max-width:31ch;display:flex;flex-direction:column;gap:14px;animation:entra .6s cubic-bezier(.2,.8,.2,1)}
.ans.ia{border-left:2px dashed var(--hair);padding-left:12px}
.parte{display:flex;flex-direction:column;gap:5px}
#lineas.hablando .ans.ahora .w{opacity:.28}
#lineas.hablando .ans.ahora .w.on{opacity:1}
.ep{font-size:.8rem;font-weight:500;line-height:1.4;color:var(--muted);letter-spacing:0;max-width:44ch}
.ep b{font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--fg)}
.ep::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;vertical-align:0;border:1.5px solid var(--fg)}
.ep-fuente::before{background:var(--fg)}
.ep-vista::before{border-radius:50%}
.ep-lectura::before{transform:rotate(45deg) scale(.85)}
.ep-general::before{border-style:dashed}
.src{font-size:.85rem;color:var(--muted);line-height:1.4;margin-top:-8px}
.dots{display:flex;gap:6px;height:24px;align-items:center}
.dots i{width:7px;height:7px;background:var(--fg);opacity:.15;animation:dt 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes dt{40%{opacity:1}}
.sug{display:flex;flex-direction:column;gap:6px;animation:entra .6s cubic-bezier(.2,.8,.2,1)}
.sug .eyb{margin-bottom:4px}
.q{text-align:left;border:1px solid var(--hair);padding:12px 14px;font-size:1.02rem;font-weight:600;line-height:1.3;min-height:50px;background:color-mix(in srgb,var(--bg) 30%,transparent)}
.q.ia{border-style:dashed}
.q:hover{border-color:var(--fg)}
.b1{min-height:56px;background:var(--acento);color:var(--sobre-acento);font-size:1rem;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;text-align:left;margin-top:8px}
.b1 span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk{font-size:.92rem;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:6px 0;text-align:left;align-self:flex-start}
.pasar{align-self:flex-start;height:44px;padding:0 14px;border:1px solid var(--fg);font-size:.95rem;font-weight:700}
.pasar:hover{background:var(--fg);color:var(--tinta)}
#obraV.sintexto #lineas{visibility:hidden}
/* v2 · detalles del cuadro dentro de la respuesta: apagados hasta que la voz llega a ellos */
.imgs{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;min-width:0;max-width:100%}
.imgs::-webkit-scrollbar{display:none}
.im{flex:none;position:relative;width:clamp(124px,36vw,160px);aspect-ratio:4/5;overflow:hidden;border:1px solid var(--hair);background:var(--panel);scroll-snap-align:start;text-align:left}
.imv{position:absolute;inset:0;background-repeat:no-repeat}
.imt{position:absolute;left:0;right:0;bottom:0;color:#fff;padding:24px 10px 9px;font-size:.85rem;font-weight:700;letter-spacing:0;line-height:1.2;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.im:hover{border-color:var(--fg)}

/* Abajo: el sello, la pista y los tres mandos */
.abajo{flex:none;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:calc(var(--sello)*.64);padding-bottom:10px}
.sello{position:absolute;left:50%;top:0;width:var(--sello);height:var(--sello);transform:translate(-50%,-36%);border-radius:50%;display:block}
.sv{position:absolute;inset:7px;border-radius:50%;overflow:hidden;border:3px solid var(--fg);background:var(--panel);box-shadow:0 16px 46px rgba(0,0,0,.6)}
.sv img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;transition:transform 1.25s cubic-bezier(.65,0,.35,1)}
.sring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);pointer-events:none}
.sring circle{fill:none;stroke-width:2.4}
.sring .sb{stroke:var(--hair)}
.sring .sf{stroke:var(--acento);stroke-dasharray:301.6;stroke-dashoffset:301.6}
.sico{position:absolute;inset:7px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 50%,transparent);opacity:0;transition:opacity .3s}
.sico svg{width:34px;height:34px;fill:var(--fg)}
#obraV.pausado .sico{opacity:1}
/* Conversación: el anillo no mide cuánto queda; late con la voz y se queda quieto mientras escucha */
#obraV.conversa .sring .sf{display:none}
#obraV.conversa .sello.late .sb{animation:late .36s ease-out}
@keyframes late{from{stroke:var(--fg);stroke-width:5.5}to{stroke:var(--hair);stroke-width:2.4}}
.pista{font-size:.92rem;line-height:1.4;color:color-mix(in srgb,var(--fg) 82%,transparent);text-align:center;min-height:2.8em;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;max-width:36ch;padding:0 8px}
.pista .lk{padding:2px 0;align-self:auto}
.mandos{display:flex;align-items:center;justify-content:center;gap:22px}
.sq{width:60px;height:60px;border:1px solid var(--hair);display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--bg) 55%,transparent)}
.sq svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2}
.sq.grande{width:74px;height:74px;background:var(--acento);color:var(--sobre-acento);border-color:var(--acento)}
/* Pruebas de diseño (Tu visita › Diseño): forma de los tres mandos */
:root[data-botones=redondeados] .sq{border-radius:28%}
:root[data-botones=redondos] .sq{border-radius:50%}
:root[data-botones=redondeados] #empezar{border-radius:14px}
:root[data-botones=redondos] #empezar{border-radius:999px;padding-inline:32px}
.sq.grande svg{width:28px;height:28px}
.sq[aria-pressed=true]:not(.grande),.sq[aria-expanded=true]{background:var(--fg);color:var(--tinta);border-color:var(--fg)}
.sq.rec{animation:inv 1s steps(2) infinite}
@keyframes inv{50%{background:var(--bg);color:var(--fg)}}
.firma{font-size:.8rem;color:var(--muted)}

/* Escribir: el campo ocupa el sitio de los mandos, grande */
#askF{width:100%;display:flex;flex-direction:column;gap:14px;padding-block:6px 4px}
#askI{width:100%;font-size:clamp(1.4rem,6vw,1.7rem);font-weight:600;letter-spacing:-.01em;padding:10px 0;border-bottom:1px solid var(--hair)}
#askI::placeholder{color:color-mix(in srgb,var(--fg) 42%,transparent)}
#askI:focus{outline:none;border-bottom-color:var(--fg)}
.esc-b{display:flex;align-items:center;justify-content:space-between;gap:12px}
.b2{height:50px;padding:0 20px;border:1px solid var(--fg);font-size:.98rem;font-weight:800;display:flex;align-items:center;gap:10px}
.b2 svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.b2:hover{background:var(--fg);color:var(--tinta)}
#obraV.escribiendo .sello,#obraV.escribiendo .pista,#obraV.escribiendo .mandos,#obraV.escribiendo .firma{display:none}
#obraV.escribiendo .abajo{padding-top:10px}

/* Panel del altavoz: voz, música y texto en pantalla */
.mandos{position:relative}
#panel{position:absolute;z-index:6;right:0;bottom:calc(100% + 10px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--hair);box-shadow:0 18px 50px rgba(0,0,0,.6)}
#panel button{display:flex;align-items:center;gap:12px;padding:12px 16px;min-width:180px;text-align:left;font-size:.95rem;font-weight:700;border-top:1px solid var(--hair)}
#panel button:first-child{border-top:0}
#panel svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;flex:none}
#panel small{display:block;font-size:.8rem;font-weight:500;color:var(--muted);margin-top:2px}
#panel button[aria-pressed=false]{color:var(--muted)}

/* Pausa para mirar: la pantalla se apaga y el visitante levanta la vista hacia el cuadro real */
#obraV.mirando #lineas>*:not(.ahora){opacity:.08}
#obraV.mirando .fondo{filter:blur(34px) brightness(.14) saturate(1.1)}
#obraV.mirando .top{opacity:.45}

/* Hojas: tu visita y ficha */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;flex-direction:column;justify-content:flex-end}
.sheet .pn{background:var(--panel);border-top:2px solid var(--fg);display:flex;flex-direction:column;max-height:88%;width:100%;max-width:620px;margin:0 auto;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
.sheet .hd{display:flex;align-items:center;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--hair)}
.sheet .hd b{flex:1;font-size:.95rem;font-weight:800}
.deep{flex:1;min-height:0;overflow-y:auto;padding-block:16px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.menu{display:flex;flex-direction:column;border-top:1px solid var(--hair)}
.fila-m{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 0;border-bottom:1px solid var(--hair);min-height:58px}
.fila-m>span:first-child{flex:1;min-width:0}
.fila-m b{display:block;font-size:.98rem;font-weight:800}
.fila-m small{display:block;font-size:.8rem;font-weight:500;color:var(--muted);margin-top:2px}
fieldset{border:0;display:flex;flex-direction:column;gap:8px}
legend{font-size:.95rem;font-weight:800;margin-bottom:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--hair)}
.seg button{padding:12px 6px;font-size:.92rem;font-weight:700;border-left:1px solid var(--hair);line-height:1.2}
.seg button:first-child{border-left:0}
.seg button small{display:block;font-size:.8rem;font-weight:500;margin-top:3px;opacity:.75}
.seg button[aria-pressed=true]{background:var(--acento);color:var(--sobre-acento)}
.opts{display:flex;flex-direction:column;border-top:1px solid var(--hair)}
.opts button{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:12px 0;border-bottom:1px solid var(--hair);font-size:.98rem;font-weight:700;line-height:1.25}
.opts button::before{content:"";width:16px;height:16px;flex:none;margin-top:2px;border:2px solid var(--muted);border-radius:50%}
.opts button[aria-pressed=true]::before{background:var(--fg);border-color:var(--fg);box-shadow:inset 0 0 0 3px var(--panel)}
.opts small{display:block;font-size:.8rem;font-weight:500;color:var(--muted);margin-top:2px}
.sheet .foot{display:flex;gap:8px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--hair)}
.sheet .foot .b1{flex:1;margin-top:0}
.b3{height:56px;padding:0 18px;border:1px solid var(--hair);font-size:.92rem;font-weight:700}
.note{font-size:.85rem;line-height:1.45;color:var(--muted)}
dl{display:grid;grid-template-columns:96px 1fr;font-size:.88rem;line-height:1.4}
dt,dd{padding:10px 0;border-top:1px solid var(--hair)}
dt{font-size:.85rem;font-weight:700;color:var(--muted);padding-right:10px}
dd{min-width:0;overflow-wrap:anywhere}
dd a{text-decoration:underline;text-underline-offset:2px}
#toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 80px);z-index:60;max-width:528px;margin:0 auto;background:var(--fg);color:var(--tinta);padding:11px 14px;font-size:.88rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
:root[data-tema=claro] .fondo{filter:blur(40px) saturate(.85) brightness(1.15);opacity:.34}
:root[data-tema=claro] #salaF{filter:blur(46px) saturate(.85) brightness(1.2);opacity:.3}
:root[data-tema=claro] #obraV.mirando .fondo{filter:blur(40px) saturate(.6);opacity:.12}
:root[data-tema=claro] #mapaC .maplibregl-canvas{filter:none}
:root[data-tema=claro] .sv,:root[data-tema=claro] .ini-s{box-shadow:0 14px 40px rgba(0,0,0,.18)}
:root[data-tema=claro] .mk,:root[data-tema=claro] .mcard{box-shadow:0 8px 24px rgba(0,0,0,.18)}
/* El logo del cliente, si lo hay: arriba del índice y en la portada */
.marcaLogo{display:block;height:34px;margin-bottom:22px;color:var(--fg)}
.marcaLogo svg{height:100%;width:auto;display:block;max-width:100%}
#inicio .marcaLogo{height:28px;margin:0 auto 6px}
/* Reglas de la marca: sin mayúsculas, sin la foto difuminada de fondo, texto alineado a la izquierda, botón principal recto */
:root[data-mayus=no] .eyb,:root[data-mayus=no] .ep b{text-transform:none;letter-spacing:0}
:root[data-fondo=liso] .fondo{display:none}
:root[data-alinear=izquierda] #inicio{align-items:flex-start;text-align:left}
:root[data-alinear=izquierda] #inicio .marcaLogo{margin-inline:0}
:root[data-cta=recto] #empezar{border-radius:0}
.marcaPie{font-size:.8rem;line-height:1.4;color:var(--muted);margin-top:8px;max-width:46ch}
.vivo{color:var(--muted)}
.h1b{display:block;color:var(--acento)}
@media (max-height:640px){ :root{--sello:clamp(96px,26vw,124px)} .mandos{gap:16px} .sq{width:54px;height:54px} .sq.grande{width:64px;height:64px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important} .sv img,.w,.cap,.fondo,#flujo,.sico{transition:none!important} }

<script>
/* La sala: un tema y una lista de obras. En la web lee los mismos archivos de obra que la unidad
   (un motor, una obra por archivo); la versión que se ve dentro de Claude los lleva incrustados. */
let SALA = /*__SALA__*/null;
const SALA_WEB = {
  nombre:'Cuatro maneras de mirar',
  d:'Una noche pintada de día, un cuarto para descansar, un vistazo a través del cristal y un incendio visto desde la orilla.',
  musica:{src:'../obras/satie-gymnopedie-1.mp3', titulo:'Satie, Gymnopédie n.º 1'},
  obras:['../obras/noche-estrellada.json', '../obras/el-dormitorio.json', '../obras/el-panuelo-rojo.json', '../obras/el-incendio-del-parlamento.json']
};
// Modelo para las preguntas libres. Dentro de Claude responde Claude; en la web, Puter (cada visitante
// con su propia cuenta) o, si se rellena «api», el servidor intermedio del proyecto.
const CONFIG = {api:'', puterModelo:''};
// Variante v2 (?v=2): conversación primero, como las esculturas que hablan. Habla la propia obra si tiene voz
// («obra»), si no el autor, y si no la guía. Una presentación, sugerencias y preguntas libres que se responden
// antes con el banco validado de la obra (qa) que con un modelo.
let V2 = new URLSearchParams(location.search).get('v') === '2';   // se cambia en directo desde «Tu visita»
// La voz que empieza en cada modo: en la conversación, la obra o su autor si los hay
function cambiarModo(conv){ V2 = conv; try{ const u = new URL(location.href); if(V2) u.searchParams.set('v', '2'); else u.searchParams.delete('v'); history.replaceState(null, '', u); }catch(e){} }
const vozDefecto = meds => V2 ? (['obra', 'autor'].find(k => meds.includes(k)) || meds[0]) : meds[0];
// Cómo se nombra la pieza en la interfaz: «el cuadro» si la obra no dice otra cosa («la fuente», «el monumento»…)
// Para miniaturas recortadas (lista, mapa, portada): el centro del encuadre de reposo, si la obra lo trae
const encuadrePos = o => o && o.encuadre ? `${((o.encuadre[0] + o.encuadre[2]/2)*100).toFixed(0)}% ${((o.encuadre[1] + o.encuadre[3]/2)*100).toFixed(0)}%` : '';
const PIEZA = () => (OBRA && OBRA.pieza) || 'el cuadro';
const alA = s => ('a ' + s).replace(/^a el /, 'al ');

/* ======================= Utilidades ======================= */
const $ = id => document.getElementById(id);
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const txt = h => { try{ return new DOMParser().parseFromString(String(h), 'text/html').body.textContent || ''; }catch(e){ return String(h); } };
const tiene = (s, p) => String(s).split(' ').includes(p);
const SENT = t => { const s = t.replace(/\[…\]/g, '⁣'); return (s.match(/[^.!?…]+[.!?…»]+|[^.!?…]+$/g) || [s]).map(x => x.trim().replace(/⁣/g, '[…]')).filter(Boolean); };
const HABLA = t => t.replace(/[«»]/g, '').replace(/\[…\]/g, ',');
const st = {get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : v; }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }};
let OBRA = null, P = null, U = null, KEY = 'am.sala.';
const store = {get:(k, d) => st.get(KEY + k, d), set:(k, v) => st.set(KEY + k, v)};
const M = () => OBRA.mediadores[P.guia];
const MED = k => OBRA.mediadores[k];
const MEDG = () => Object.keys(OBRA.mediadores)[0];
const VIS = () => OBRA.visitas[P.perfil];
const incl = c => (!c.p || tiene(c.p, P.perfil)) && !(c.x && tiene(c.x, P.perfil));
// Pruebas de diseño para comparar plantillas; se recuerdan en este dispositivo
const DIS = {botones:st.get('am.sala.botones', 'rectos')};
const aplicarDiseno = () => { document.documentElement.dataset.botones = DIS.botones; };
aplicarDiseno();
const G = {voz:st.get('am.sala.voz', '1') === '1', texto:st.get('am.sala.texto', '1') === '1', musica:st.get('am.sala.musica', '0') === '1'};
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 3400); }

/* ======================= La sala ======================= */
// Otra sala (?sala=pamplona): su tema y su lista de obras en unidad/salas/<sala>.json
const SALA_ID = (() => { try{ const v = new URLSearchParams(location.search).get('sala'); return v && /^[a-z0-9-]+$/.test(v) ? v : null; }catch(e){ return null; } })();
// La marca del cliente: un archivo con su logo, tema, acento, tipografía de títulos y forma de los botones.
// La lee la sala («marca») o el enlace (?marca=<marca>, o ?marca=ninguna para verla sin marca). La mediación no cambia
let MARCA = null;
const MARCA_ID = (() => { try{ const v = new URLSearchParams(location.search).get('marca'); return v && /^[a-z0-9-]+$/.test(v) ? v : null; }catch(e){ return null; } })();
async function aplicarMarca(url){
  try{
    const m = await fetch(url).then(r => { if(!r.ok) throw new Error('marca'); return r.json(); });
    const R = document.documentElement, pon = (k, v) => { if(v) R.style.setProperty(k, String(v)); };
    if(m.tema === 'claro' || m.tema === 'oscuro') R.dataset.tema = m.tema;
    pon('--bg', m.fondo); pon('--acento', m.acento); pon('--sobre-acento', m.sobreAcento); pon('--muted', m.secundario);
    if(m.titulos && m.titulos.familia){
      if(m.titulos.css){ const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = m.titulos.css; document.head.appendChild(l); }
      pon('--fuente-titulos', `"${m.titulos.familia}", var(--font)`); pon('--peso-titulos', m.titulos.peso); pon('--peso-titulos-2', m.titulos.peso);
    }
    if(m.texto && m.texto.familia){
      if(m.texto.css){ const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = m.texto.css; document.head.appendChild(l); }
      pon('--fuente', `"${m.texto.familia}", Arial, Helvetica, sans-serif`);
    }
    if(m.titulos && m.titulos.tracking != null) pon('--track-titulos', m.titulos.tracking);
    if(m.mayusculas === false) R.dataset.mayus = 'no';
    if(m.fondoImagen === false) R.dataset.fondo = 'liso';
    if(m.alinear) R.dataset.alinear = m.alinear;
    if(m.cta) R.dataset.cta = m.cta;
    if(m.botones){ DIS.botones = m.botones; aplicarDiseno(); }
    // El logo es un SVG propio: va dentro de la página para que tome el color del texto (claro u oscuro)
    let svg = '';
    if(m.logo){ try{ svg = await fetch(new URL(m.logo, url).href).then(r => r.ok ? r.text() : ''); }catch(e){} }
    MARCA = {nombre:m.nombre || '', logo:/^\s*<svg[\s>]/i.test(svg) && !/<script/i.test(svg) ? svg : '', pie:m.pie || '', acentoPorObra:!!m.acentoPorObra};
  }catch(e){ MARCA = null; }
}
function pintarLogo(id){ const el = $(id), ok = !!(MARCA && MARCA.logo); el.hidden = !ok; if(ok){ el.innerHTML = MARCA.logo; el.setAttribute('aria-label', MARCA.nombre); } }
async function cargarSala(){
  if(SALA) return;
  const abs = (v, desde) => v && !/^(data:|blob:|https?:)/.test(v) ? new URL(v, desde).href : v;
  let DEF = SALA_WEB, base = location.href;
  if(SALA_ID){ base = new URL(`../salas/${SALA_ID}.json`, location.href).href; DEF = await fetch(base).then(r => { if(!r.ok) throw new Error('sala'); return r.json(); }); }
  if(MARCA_ID !== 'ninguna'){ const mu = MARCA_ID ? new URL(`../marcas/${MARCA_ID}.json`, location.href).href : DEF.marca ? new URL(DEF.marca, base).href : null; if(mu) await aplicarMarca(mu); }
  const res = await Promise.allSettled(DEF.obras.map(async ruta => {
    const url = new URL(ruta, base).href;
    const d = await fetch(url).then(r => { if(!r.ok) throw new Error(ruta); return r.json(); });
    d.id = ruta.split('/').pop().replace(/\.json$/, '');
    Object.values(d.mediadores || {}).forEach(m => { if(m.audio && m.audio.src) m.audio.src = abs(m.audio.src, url); });
    if(d.iiif){
      // IIIF: el tamaño sale de su info.json; el sello usa una vista de 1.200 px como la unidad
      const base = abs(d.iiif, url).replace(/\/(info\.json)?$/, '');
      try{ const info = await fetch(base + '/info.json').then(r => r.json()); d.iw = info.width; d.ih = info.height; d._iiif = base; d._recorta = !JSON.stringify(info.profile || '').includes('level0'); }catch(e){}
      d.img = d.img ? abs(d.img, url) : `${base}/full/${d.iw ? Math.min(1200, d.iw) : 843},/0/default.jpg`;
      d.fondo = d.fondo ? abs(d.fondo, url) : `${base}/full/96,/0/default.jpg`;
    } else { d.img = abs(d.img, url); d.fondo = abs(d.fondo || d.img, url); }
    if(!d.iw && d.img) await new Promise(ok => { const im = new Image(); im.onload = () => { d.iw = im.naturalWidth; d.ih = im.naturalHeight; ok(); }; im.onerror = ok; im.src = d.img; });
    return d;
  }));
  const obras = res.filter(r => r.status === 'fulfilled' && r.value.iw).map(r => r.value);
  if(!obras.length) throw new Error('sin obras');
  SALA = {...DEF, musica:DEF.musica ? {...DEF.musica, src:new URL(DEF.musica.src, base).href} : null, obras};

  dl.insertAdjacentHTML('beforeend', `<dt id="${id}">Catálogo abierto</dt><dd class="vivo">Cargando desde Wikidata…</dd>`);
  try{
    const d = await wdDatos(o.wikidata); if(OBRA !== o || !document.getElementById(id)) return;
    // La pieza puede dejar fuera un dato de Wikidata que no coincide con sus fuentes («wikidataOmite»)
    const omite = new Set(o.wikidataOmite || []);
    const filas = [['inventario', 'Número de inventario', d.inv], ['fecha', 'Fecha', wdFecha(d.fecha)], ['material', 'Material', d.material.join(', ')], ['lugar', 'Lugar del hallazgo', d.lugar.join(', ')], ['hallazgo', 'Hallazgo', wdFecha(d.hallado)],
      ['medidas', 'Medidas', d.medidas.map(([n, c]) => `${n} ${wdMedida(c)}`).filter(x => !/ $/.test(x)).join(' · ')]].filter(f => f[2] && !omite.has(f[0])).map(f => f.slice(1));
    const t = document.getElementById(id); t.nextElementSibling.remove();
    t.insertAdjacentHTML('afterend', filas.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('') +
      `<dt>Fuente</dt><dd><a href="https://www.wikidata.org/wiki/${esc(o.wikidata)}" target="_blank" rel="noopener">Wikidata ${esc(o.wikidata)}</a>, en directo · CC0</dd>`);
    t.remove();
  }catch(e){ const t = document.getElementById(id); if(t) t.nextElementSibling.textContent = 'No se ha podido cargar ahora.'; }
}

/* ======================= Voz y música ======================= */
let AC = null, MG = null, MSRC = null, MBUF = null;
function contexto(){
  if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; try{ AC = new C(); MG = AC.createGain(); MG.gain.value = .5; MG.connect(AC.destination); }catch(e){ AC = null; return null; } }
  if(AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}
function bytesDe(src){ return fetch(src).then(r => { if(!r.ok) throw new Error(r.status); return r.arrayBuffer(); }); }
function pista(){
  if(!MBUF){ MBUF = bytesDe(SALA.musica.src).then(b => new Promise((res, rej) => contexto().decodeAudioData(b, res, rej))); MBUF.catch(() => { MBUF = null; }); }
  return MBUF;
}
function musica(on){
  if(on && !(SALA && SALA.musica)) return;
  if(!on){ if(MSRC){ try{ MSRC.stop(); }catch(e){} MSRC = null; } return; }
  if(MSRC || !contexto()) return;
  pista().then(b => { if(!G.musica || MSRC) return; MSRC = AC.createBufferSource(); MSRC.buffer = b; MSRC.loop = true; MSRC.connect(MG); MSRC.start(); nivelMusica(); }).catch(() => toast('No se ha podido cargar la música'));
}
function nivelMusica(){ if(AC && MG) MG.gain.setTargetAtTime((U && U.playing) || hablando ? .22 : .5, AC.currentTime, .5); }
function callar(){
  try{ speechSynthesis.cancel(); }catch(e){}
  cancelAnimationFrame(VOZ.raf);
  if(VOZ.nodo){ const n = VOZ.nodo; VOZ.nodo = null; n.onended = null; try{ n.stop(); }catch(e){} }
}
// Voz grabada: cada cápsula suena desde su tramo del archivo y las palabras se encienden con sus tiempos
const VOZ = {src:null, bytes:null, carga:null, fallo:false, nodo:null, raf:0};
function precargarVoz(a){ if(VOZ.src === a.src) return; Object.assign(VOZ, {src:a.src, carga:null, fallo:false, bytes:bytesDe(a.src)}); VOZ.bytes.catch(() => { VOZ.fallo = true; }); }
function vozGrabada(){
  if(!VOZ.carga){ const ac = contexto(); if(!ac) return Promise.reject(); VOZ.carga = VOZ.bytes.then(buf => new Promise((res, rej) => ac.decodeAudioData(buf.slice(0), res, rej))); VOZ.carga.catch(() => { VOZ.fallo = true; }); }
  return VOZ.carga;
}
function decirCapsula(C, tok){
  const ws = C.frases.flatMap(f => f.w), au = C.au, si0 = U.si;
  let k = 0; for(let i = 0; i < si0; i++) k += C.frases[i].w.length;
  const desde = Math.max(0, (k ? au.w[k] : au.de) - .06), hasta = au.a + .2;
  vozGrabada().then(buf => {
    if(tok !== U.tok || !U.playing) return;
    const ac = contexto(), src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
    const t0 = ac.currentTime + .05; src.start(t0, desde, Math.max(.1, hasta - desde)); VOZ.nodo = src;
    let n0 = -1;
    const paso = () => {
      if(tok !== U.tok) return;
      const t = desde + Math.max(0, ac.currentTime - t0);
      let n = k; while(n < ws.length && au.w[n] <= t + .04) n++;
      if(n !== n0){
        if(n0 >= 0 && n > n0) latido();
        n0 = n; ws.slice(0, n).forEach(w => w.classList.add('on')); seguir(ws[n - 1]);
        let a = 0, si = 0; while(si < C.frases.length - 1 && a + C.frases[si].w.length < n){ a += C.frases[si].w.length; si++; }
        U.si = Math.max(si0, si); anillo((U.i + n/ws.length)/U.caps.length, 300);
      }
      VOZ.raf = requestAnimationFrame(paso);
    };
    src.onended = () => {
      if(tok !== U.tok) return;
      cancelAnimationFrame(VOZ.raf); VOZ.nodo = null; C.frases.forEach(f => encender(f)); U.si = C.frases.length;
      U.timer = setTimeout(() => { if(tok === U.tok && U.playing) sonar(); }, 180);
    };
    paso();
  }).catch(() => { if(tok === U.tok && U.playing){ VOZ.fallo = true; sonar(); } });
}
function vozPara(k){
  let vs = []; try{ vs = (speechSynthesis.getVoices() || []).filter(x => /^es/i.test(x.lang)); }catch(e){}
  if(!vs.length) return null;
  const fem = /m[oó]nica|paulina|marisol|luc[ií]a|elvira|helena|laura|sabina|paloma|conchita|marta|isabel|female|mujer/i, mas = /jorge|diego|juan|pablo|carlos|enrique|miguel|[aá]lvaro|ra[uú]l|male|hombre/i;
  const quiere = (OBRA.voces[k] || {}).fem ? fem : mas;
  return vs.find(v => quiere.test(v.name) && /es-ES/i.test(v.lang)) || vs.find(v => quiere.test(v.name)) || vs.find(v => /es-ES/i.test(v.lang)) || vs[0];
}
try{ speechSynthesis.getVoices(); }catch(e){}
// Una frase: las palabras se encienden con la voz; sin voz (o silenciada), el texto sigue a ritmo de lectura
function decirFrase(f, tok, fin){
  clearInterval(U.reloj);
  const vd = OBRA.voces[f.voz || U.voz] || {pitch:1, rate:1}, rate = (vd.rate || 1)*(VIS().lenta ? .92 : 1), ms = 60000/(165*rate);
  let n = 0, conLimites = false, hecho = false, empezo = false, wd = 0;
  const reloj = () => { clearInterval(U.reloj); U.reloj = setInterval(() => { if(tok !== U.tok || conLimites){ clearInterval(U.reloj); return; } n = Math.min(f.w.length - 1, n + 1); encender(f, n + 1); }, ms); };
  const acabar = () => { if(hecho || tok !== U.tok) return; hecho = true; clearTimeout(wd); clearInterval(U.reloj); fin(); };
  const sinVoz = () => { reloj(); clearTimeout(wd); wd = setTimeout(acabar, f.w.length*ms + 500); };
  encender(f, 1);
  if(!G.voz || !window.speechSynthesis) return sinVoz();
  try{
    speechSynthesis.cancel();
    const limpio = HABLA(f.t), u = new SpeechSynthesisUtterance(limpio); u.lang = 'es-ES'; u.rate = rate; u.pitch = vd.pitch || 1;
    const v = vozPara(f.voz || U.voz); if(v) u.voice = v;
    u.onboundary = e => { if(tok !== U.tok || (e.name && e.name !== 'word')) return; conLimites = true; n = limpio.slice(0, e.charIndex + 1).split(/\s+/).filter(Boolean).length; encender(f, n); };
    u.onstart = () => { empezo = true; clearTimeout(wd); wd = setTimeout(acabar, f.w.length*ms*2.5 + 4000); setTimeout(() => { if(!conLimites && tok === U.tok) reloj(); }, 500); };
    u.onend = acabar;
    u.onerror = e => { if(e.error === 'interrupted' || e.error === 'canceled') return; sinVoz(); };
    wd = setTimeout(() => { if(!empezo && tok === U.tok) sinVoz(); }, 1800);
    speechSynthesis.speak(u);
  }catch(e){ sinVoz(); }
}

let WL = null;
async function wake(on){ try{ if(on && !WL && navigator.wakeLock){ WL = await navigator.wakeLock.request('screen'); WL.addEventListener('release', () => { WL = null; }); } else if(!on && WL){ const w = WL; WL = null; await w.release(); } }catch(e){} }

  if(SALA && h && SALA.obras.some(o => o.id === h)){
    const o = SALA.obras.find(x => x.id === h); if(o.lugar && !GEO.pos) aqui(o);   // el código dice dónde estás, sin GPS
    if(!OBRA || OBRA.id !== h || $('obraV').hidden) abrir(h);
  }
  else if(SALA && $('obraV').hidden) $('salaV').hidden = false;
}
