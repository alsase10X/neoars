<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Historia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500&display=swap" rel="stylesheet">
<style>
/* HISTORIA · varias unidades encadenadas · mismo sistema que la unidad de obra mediada.
   UNIDAD DE OBRA MEDIADA · motor genérico · móvil primero.
   La obra arriba; debajo, el relato como las letras de una canción. Voz y texto siempre juntos.
   Desplazar el relato mueve la voz; tocar una zona del cuadro lleva a lo que se dice de ella.
   Zoom libre sin cortar nada. Sistema neutro: el color lo pone la obra. */
:root{
  color-scheme:dark;
  --bg:#0a0a0b; --fg:#f6f5f2; --muted:#a29e97; --hair:rgba(255,255,255,.2);
  --font:"Archivo","Helvetica Neue",Arial,sans-serif;
  --pad:18px; --barH:58px; --letraH:44vh;
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.2}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--fg);outline-offset:-3px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
.fondo{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(30px) brightness(.42) saturate(1.2);transform:translateZ(0)}

#unidad{position:fixed;inset:0;background:var(--bg);overflow:hidden}
#vp{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;box-shadow:0 24px 80px rgba(0,0,0,.6)}
#stage img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
#teselas{position:absolute;inset:0;pointer-events:none}
#teselas img{position:absolute;display:block;transition:opacity .35s}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .7s}
#ov.on{opacity:1}

.scrim-t{position:absolute;left:0;right:0;top:0;height:96px;background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,0));pointer-events:none}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top,0px) + 8px) 6px 0 4px;z-index:5}
.who{flex:1;min-width:0;padding-left:2px}
.who b{display:block;font-size:.95rem;font-weight:900;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;font-size:.85rem;color:rgba(255,255,255,.75);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;display:grid;place-items:center;font-size:.92rem;font-weight:800;flex:none}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.ib:hover,.ib[aria-pressed=true]{background:var(--fg);color:#000}
.pill{position:absolute;left:50%;transform:translateX(-50%);z-index:7;height:38px;padding:0 14px;background:rgba(10,10,11,.82);border:1px solid rgba(255,255,255,.5);font-size:.9rem;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:8px}
.pill:hover{background:var(--fg);color:#000}
#encuadre{bottom:calc(var(--barH) + var(--letraH) + 12px)}

/* ---------- El relato, como letras ---------- */
#letra{position:absolute;left:0;right:0;bottom:var(--barH);height:var(--letraH);z-index:6;display:flex;flex-direction:column;background:linear-gradient(rgba(10,10,11,0),rgba(10,10,11,.88) 34px,rgba(10,10,11,.96))}
.lhd{display:flex;align-items:center;gap:10px;padding:14px var(--pad) 4px}
.lhd .quien{flex:1;min-width:0}
.lhd .quien b{display:block;font-size:.95rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhd .quien small{display:block;font-size:.85rem;color:var(--muted);margin-top:2px}
.play{height:42px;padding:0 16px 0 13px;display:flex;align-items:center;gap:8px;background:var(--fg);color:#000;font-size:.95rem;font-weight:800;flex:none}
.play svg{width:16px;height:16px;fill:currentColor}
#lista{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding:0 var(--pad);
  -webkit-mask-image:linear-gradient(transparent,#000 13%,#000 78%,transparent);mask-image:linear-gradient(transparent,#000 13%,#000 78%,transparent)}
#lista::-webkit-scrollbar{display:none}
#lista .tope{height:var(--foco,60px)}
#lista .cola{height:70%}
.cap{display:block;width:100%;text-align:left;padding:18px 0;font-size:clamp(1.12rem,4.8vw,1.34rem);font-weight:700;letter-spacing:-.012em;line-height:1.38;max-width:34ch;opacity:.28;transition:opacity .4s;cursor:pointer}
/* Un solo tamaño para todas las cápsulas y una línea fina entre ellas: se ve dónde empieza y acaba cada una */
#lista .cap + .cap{border-top:1px solid var(--hair)}
.cap p+p,.cap p+div,.cap div+p{margin-top:.55em}
.cap.ya{opacity:.5}
.cap.ahora,.cap.apunta{opacity:1;cursor:default}
#lista.moviendo .cap.ahora:not(.apunta){opacity:.5}
.cap blockquote{font-style:normal;font-weight:inherit;border:0;padding:0}
.cap .ref{font-size:.85rem;font-weight:500;font-style:normal;color:var(--muted);line-height:1.35;margin-top:8px;letter-spacing:0}
.cap .ref a{text-decoration:underline;text-underline-offset:2px}
.w{transition:opacity .25s}
#unidad.sonando .cap.ahora .w{opacity:.32}
#unidad.sonando .cap.ahora .w.on{opacity:1}
.fin{display:flex;flex-direction:column;gap:10px;padding:22px 0 0;opacity:.3;transition:opacity .4s}
.fin .qs{margin-bottom:8px}
.fin .b1 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fin.ahora,.fin.apunta{opacity:1}
.b1{height:54px;background:var(--fg);color:#000;font-size:1rem;font-weight:800;display:flex;align-items:center;justify-content:space-between;padding:0 18px;max-width:420px}
.lk{font-size:.9rem;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:6px 0;text-align:left;align-self:flex-start}

.askbar{position:fixed;left:0;right:0;bottom:0;z-index:35;display:flex;align-items:stretch;background:#141416;border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px)}
.askbar input{flex:1;min-width:0;background:none;border:0;padding:0 var(--pad);height:57px;font-size:1rem}
.askbar input::placeholder{color:#c9c5be}
.askbar input:focus{outline:none}
.askbar button{width:56px;display:grid;place-items:center;border-left:1px solid var(--hair)}
.askbar button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.askbar .send{background:var(--fg);color:#000}
.askbar .rec{animation:inv 1s steps(2) infinite}
/* Menú «⋯»: ficha, música, quién te la cuenta, visita y lo que sé de ti */
.menu{display:flex;flex-direction:column;border-top:1px solid var(--hair)}
.fila-m{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 0;border-bottom:1px solid var(--hair);min-height:58px}
.fila-m>span:first-child{flex:1;min-width:0}
.fila-m b{display:block;font-size:.98rem;font-weight:800}
.fila-m small{display:block;font-size:.8rem;font-weight:500;color:var(--muted);margin-top:2px}
.tog{width:40px;height:22px;border:2px solid var(--muted);position:relative;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--muted);transition:left .2s}
.fila-m[aria-pressed=true] .tog{border-color:var(--fg);background:var(--fg)}
.fila-m[aria-pressed=true] .tog::after{left:20px;background:#000}
@keyframes inv{50%{background:var(--fg);color:#000}}

.sheet{position:fixed;left:0;right:0;z-index:30;display:flex;flex-direction:column}
.sheet .pn{background:#0d0d0e;border-top:2px solid var(--fg);display:flex;flex-direction:column;height:100%;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
#hablarS{top:36%;bottom:var(--barH)}
/* Con el teclado abierto, la conversación ocupa exactamente la parte visible de la pantalla */
html.teclado #hablarS{top:var(--vvTop,0px);bottom:auto;height:calc(var(--vvH,100vh) - var(--barH))}
html.teclado .askbar{bottom:auto;top:calc(var(--vvTop,0px) + var(--vvH,100vh) - var(--barH));padding-bottom:0}
#ajS,#fichaS{top:0;bottom:0;z-index:45;background:rgba(0,0,0,.4);padding-top:14%}
.sheet .hd{display:flex;align-items:center;gap:10px;padding:10px 6px 10px var(--pad);border-bottom:1px solid var(--hair)}
.sheet .hd b{flex:1;font-size:.95rem;font-weight:800}
.deep{flex:1;min-height:0;overflow-y:auto;padding:16px var(--pad) 22px;display:flex;flex-direction:column;gap:16px}
.vts{font-size:1.3rem;font-weight:800;letter-spacing:-.02em;line-height:1.2;max-width:24ch}
.you{font-size:1rem;font-weight:700;color:var(--muted);align-self:flex-end;text-align:right;max-width:30ch}
.qn{font-size:.95rem;font-weight:800;margin-bottom:-8px}
.ans{font-size:1.06rem;line-height:1.5;font-weight:500;max-width:38ch;display:flex;flex-direction:column;gap:10px}
.ans.ia{border-left:2px dashed var(--hair);padding-left:12px}
.ans blockquote{font-style:italic;border-left:2px solid var(--fg);padding-left:12px}
.ans .ref{font-size:.85rem;color:var(--muted);margin-top:6px}
.src{font-size:.85rem;color:var(--muted)}
.dots{display:flex;gap:6px;height:20px;align-items:center}
.dots i{width:7px;height:7px;background:var(--fg);opacity:.15;animation:dt 1.2s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes dt{40%{opacity:1}}
.qs{display:flex;flex-direction:column;gap:6px}
.q{text-align:left;border:1px solid var(--hair);padding:10px 12px;font-size:.98rem;font-weight:700;line-height:1.28;min-height:44px}
.q.ia{border-style:dashed}
.q:hover{border-color:var(--fg)}
.pasar{align-self:flex-start;height:42px;padding:0 14px;border:1px solid var(--fg);font-size:.95rem;font-weight:700}
.pasar:hover{background:var(--fg);color:#000}
fieldset{border:0;display:flex;flex-direction:column;gap:8px}
legend{font-size:.95rem;font-weight:800;margin-bottom:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--hair)}
.seg button{padding:12px 6px;font-size:.92rem;font-weight:700;border-left:1px solid var(--hair);line-height:1.2}
.seg button:first-child{border-left:0}
.seg button small{display:block;font-size:.8rem;font-weight:500;margin-top:3px;opacity:.75}
.seg button[aria-pressed=true]{background:var(--fg);color:#000}
.opts{display:flex;flex-direction:column;border-top:1px solid var(--hair)}
.opts button{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:12px 0;border-bottom:1px solid var(--hair);font-size:.98rem;font-weight:700;line-height:1.25}
.opts button::before{content:"";width:16px;height:16px;flex:none;margin-top:2px;border:2px solid var(--muted);border-radius:50%}
.opts button[aria-pressed=true]::before{background:var(--fg);border-color:var(--fg);box-shadow:inset 0 0 0 3px #0d0d0e}
.opts small{display:block;font-size:.8rem;font-weight:500;color:var(--muted);margin-top:2px}
.sheet .foot{display:flex;gap:8px;padding:12px var(--pad) calc(env(safe-area-inset-bottom,0px) + 12px);border-top:1px solid var(--hair)}
.sheet .foot .b1{flex:1;max-width:none}
.b2{height:54px;padding:0 18px;border:1px solid var(--hair);font-size:.9rem;font-weight:700}
.note{font-size:.85rem;line-height:1.45;color:var(--muted)}
dl{display:grid;grid-template-columns:100px 1fr;font-size:.88rem;line-height:1.4}
dt,dd{padding:10px 0;border-top:1px solid var(--hair)}
dt{font-size:.85rem;font-weight:700;color:var(--muted)}
dd a{text-decoration:underline;text-underline-offset:2px}
#toast{position:fixed;left:var(--pad);right:var(--pad);top:calc(env(safe-area-inset-top,0px) + 60px);z-index:60;background:var(--fg);color:#000;padding:11px 14px;font-size:.88rem;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
@media (min-width:900px){
  :root{--pad:28px;--letraH:40vh}
  #letra,.askbar,#hablarS{left:50%;right:auto;width:720px;margin-left:-360px}
  #ajS .pn,#fichaS .pn{max-width:620px;width:100%;margin:0 auto}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important} .w,#ov,.cap,.fin{transition:none!important} }
/* ---------- Historia: varias obras encadenadas, como las pistas de un disco ---------- */
#stage{transition:opacity .3s}
/* ---------- Portada: pantalla propia, como la carátula de un disco ---------- */
.portadaS{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;transition:opacity .7s,transform .7s}
.portadaS.fuera{opacity:0;transform:scale(.96);pointer-events:none}
.portadaS > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.p-velo{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,0) 18%,rgba(0,0,0,0) 36%,rgba(10,10,11,.72) 60%,rgba(10,10,11,.97))}
.p-top{position:absolute;top:0;left:0;right:0;display:flex;padding:calc(env(safe-area-inset-top,0px) + 8px) 6px 0 4px;z-index:2}
.p-cuerpo{position:relative;z-index:2;display:flex;flex-direction:column;gap:14px;padding:0 var(--pad) calc(env(safe-area-inset-bottom,0px) + 24px);max-width:600px}
.p-kick{font-size:.8rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.p-cuerpo h1{font-size:clamp(2.6rem,13vw,4.4rem);font-weight:900;letter-spacing:-.04em;line-height:.95;text-wrap:balance}
.p-texto{min-height:5.6em}
.p-tema{font-size:clamp(1.1rem,4.8vw,1.35rem);font-weight:700;line-height:1.35;max-width:30ch}
.p-texto .cap{display:none;padding:0;opacity:1;font-size:clamp(1.2rem,5.4vw,1.5rem);max-width:30ch;cursor:default}
.portadaS.empezada .p-tema,.portadaS:not(.empezada) .p-texto .cap{display:none}
.portadaS.empezada .p-texto .cap.ahora{display:block}
.portadaS.sonando .cap.ahora .w{opacity:.32}
.portadaS.sonando .cap.ahora .w.on{opacity:1}
.p-acc{display:flex;align-items:center;gap:6px 20px;flex-wrap:wrap}
.p-acc .b1{min-width:210px;max-width:none}
@media (prefers-reduced-motion:reduce){ .portadaS{transition:none} }
.tira{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px var(--pad) 2px 0;margin-right:calc(-1*var(--pad))}
.tira::-webkit-scrollbar{display:none}
.tira button{flex:none;width:64px;display:flex;flex-direction:column;gap:5px;text-align:left}
.tira img{width:64px;height:64px;object-fit:cover;display:block;background:#222}
.tira span{font-size:.8rem;font-weight:700;line-height:1.2;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tira button:hover span{color:var(--fg)}
.nw{white-space:nowrap}
a.fila-m{text-decoration:none}
#unidad:not(.sonando) #lista .cap{opacity:1}
.p-acc .b2{min-width:120px}
.finh{font-size:.8rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:6px}
.hist b{font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
dd{min-width:0;overflow-wrap:anywhere}
</style>

<section id="unidad">
  <div class="fondo" aria-hidden="true"></div>
  <div id="vp">
    <div id="stage">
      <img id="pic" alt="">
      <div id="teselas"></div>
      <svg id="ov" aria-hidden="true" preserveAspectRatio="none">
        <defs>
          <filter id="pluma" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
          <mask id="mk" maskUnits="userSpaceOnUse"><rect id="mkr" fill="#fff"/><g id="huecos" filter="url(#pluma)"></g></mask>
        </defs>
        <rect id="velo" fill="#000" fill-opacity=".6" mask="url(#mk)"/>
      </svg>
    </div>
  </div>
  <div class="scrim-t"></div>
  <div class="top">
    <button class="ib" id="salir" aria-label="Volver a la exposición"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="who"><b id="tTit"></b><small id="tSub"></small></div>
    <button class="ib" id="ajustesB" aria-label="Más: ficha de la obra y música"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg></button>
  </div>
  <button class="pill" id="encuadre" hidden>Volver al encuadre</button>
  <div id="letra">
    <div class="lhd">
      <div class="quien"><b id="lName"></b><small id="lSub"></small></div>
      <button class="play" id="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="playP" d="M7 5l12 7-12 7z"/></svg><span id="playT">Escuchar</span></button>
    </div>
    <div id="lista" aria-live="polite"></div>
  </div>
</section>

<form class="askbar" id="askF" autocomplete="off">
  <input id="askI" enterkeyhint="send" aria-label="Tu pregunta">
  <button type="button" id="mic" aria-label="Preguntar con la voz"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <button class="send" aria-label="Enviar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</form>

<div class="sheet" id="hablarS" hidden>
  <div class="pn" role="dialog" aria-labelledby="hName">
    <div class="hd"><b id="hName"></b><button class="ib" data-close aria-label="Cerrar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="deep" id="deep"></div>
  </div>
</div>
<div class="sheet" id="ajS" hidden>
  <div class="pn" role="dialog" aria-label="Más">
    <div class="hd"><b>Tu visita</b><button class="ib" data-close aria-label="Cerrar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="deep">
      <div class="menu">
        <a class="fila-m" id="mUnidad" href="#" hidden><span><b>Ver la obra completa</b><small id="mUnidadT"></small></span><span aria-hidden="true">→</span></a>
        <button class="fila-m" type="button" id="mFicha"><span><b>Ficha de esta obra</b><small id="mObra"></small></span><span aria-hidden="true">→</span></button>
        <button class="fila-m" type="button" id="musicaB" aria-pressed="false" hidden><span><b>Música</b><small id="mMus"></small></span><span class="tog" aria-hidden="true"></span></button>
      </div>
    </div>
  </div>
</div>
<div class="sheet" id="fichaS" hidden>
  <div class="pn" role="dialog" aria-label="Ficha de la obra">
    <div class="hd"><b id="fTit"></b><button class="ib" data-close aria-label="Cerrar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="deep"><dl id="fDl"></dl><p class="note" id="fNotaO"></p><div class="hist" id="fHist"></div></div>
  </div>
</div>
<section class="portadaS" id="portadaS" aria-label="Portada de la historia">
  <img id="pImg" alt="">
  <div class="p-velo" aria-hidden="true"></div>
  <div class="p-top"><button class="ib" id="pSalir" aria-label="Volver"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button></div>
  <div class="p-cuerpo">
    <span class="p-kick" id="pKick"></span>
    <h1 id="pTit"></h1>
    <div class="p-texto" id="pTexto" aria-live="polite"><p class="p-tema" id="pTema"></p></div>
    <div class="p-acc">
      <button class="b1" id="pPlay"><span id="pPlayT">Escuchar</span> <span id="pPlayF" aria-hidden="true">→</span></button>
      <button class="b2" id="pLeer">Leer</button>
      <button class="lk" id="pObras" aria-expanded="false">Ver las obras</button>
    </div>
    <div class="tira" id="pTira" hidden></div>
  </div>
</section>
<div id="toast" role="status"></div>

<script>
/* ═════════════════════════════════════════════════════════════════════
   HISTORIA — varias obras encadenadas, como las pistas de un disco.
   Cada historia es un archivo: su tema, su entrada, una parada por obra con textos
   escritos para ese tema, y su cierre. De cada obra toma la imagen, las zonas,
   la ficha, las citas y las preguntas preparadas; su unidad completa sigue a un toque.
   (?historia=archivo.json carga otra historia de este mismo sitio.)
   ═════════════════════════════════════════════════════════════════════ */
const HISTORIA = 'desde-dentro.json';

const $ = id => document.getElementById(id);
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
let S, OBRAS = [], OBRA = null, PACT = -1, P, U, KEY;
const store = {get(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:v}catch(e){return d}}, set(k,v){try{localStorage.setItem(KEY+k,v)}catch(e){}}};
const SENT = t => { const s = t.replace(/\[…\]/g, '⁣'); return (s.match(/[^.!?…]+[.!?…»]+|[^.!?…]+$/g) || [s]).map(x => x.trim().replace(/⁣/g, '[…]')).filter(Boolean); };
const HABLA = t => t.replace(/[«»]/g, '').replace(/\[…\]/g, ',');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GK = () => Object.keys(OBRA.mediadores)[0];          // la guía de la obra que se está viendo
const M = () => OBRA.mediadores[GK()];
const MED = k => OBRA.mediadores[k];
const espera = ms => new Promise(r => setTimeout(r, ms));
// La ficha admite enlaces y cursivas; todo lo demás se queda en texto
function limpioHTML(h){
  const doc = new DOMParser().parseFromString('<div>' + String(h) + '</div>', 'text/html'), out = document.createElement('span');
  const copia = (n, dest) => n.childNodes.forEach(c => {
    if(c.nodeType === 3){ dest.appendChild(document.createTextNode(c.textContent)); return; }
    if(c.nodeType !== 1) return;
    const tag = c.tagName.toLowerCase();
    if(tag === 'a' && /^https?:\/\//i.test(c.getAttribute('href') || '')){ const a = document.createElement('a'); a.href = c.getAttribute('href'); a.target = '_blank'; a.rel = 'noopener'; copia(c, a); dest.appendChild(a); }
    else if(tag === 'i' || tag === 'em'){ const e = document.createElement('em'); copia(c, e); dest.appendChild(e); }
    else copia(c, dest);
  });
  if(doc.body.firstChild) copia(doc.body.firstChild, out);
  return out.innerHTML;
}

/* ======================= Carga: la historia y sus obras ======================= */
async function cargarHistoria(url){
  const r = await fetch(url); if(!r.ok) throw 0;
  S = await r.json();
  const abs = v => v && !/^(data:|blob:|https?:)/.test(v) ? new URL(v, url).href : v;
  if(S.musica) S.musica.src = abs(S.musica.src);
  S.paradas.forEach(pa => { pa.obra = abs(pa.obra); pa.unidad = abs(pa.unidad); });
  // La portada: una sola imagen (una obra entera o un encuadre de ella), sirva la historia para tres obras o para treinta
  S.portada = S.portada || {}; if(!(S.portada.obra >= 0 && S.portada.obra < S.paradas.length)) S.portada.obra = 0;
  OBRAS = await Promise.all(S.paradas.map(async pa => { const o = await (await fetch(pa.obra)).json(); resolver(o, pa.obra); await prepararImagen(o); return o; }));
  iniciar();
}
// Rutas de imagen y fondo, relativas al archivo de cada obra
function resolver(o, desde){
  const abs = v => v && !/^(data:|blob:|https?:)/.test(v) ? new URL(v, desde).href : v;
  o.img = abs(o.img); o.fondo = abs(o.fondo); o.iiif = abs(o.iiif);
}
async function prepararImagen(o){
  if(o.iiif){
    const base = o.iiif.replace(/\/(info\.json)?$/, '');
    try{
      const info = await fetch(base + '/info.json').then(r => r.json()), t = (info.tiles || [{}])[0];
      o._iiif = {base, w:info.width, h:info.height, tw:t.width || 512, th:t.height || t.width || 512, sf:(t.scaleFactors || [1,2,4,8,16,32]).slice().sort((a, b) => a - b)};
      o.iw = o._iiif.w; o.ih = o._iiif.h;
    }catch(e){ o._iiif = null; }
    o.img = o.img || `${base}/full/${o._iiif ? Math.min(1200, o._iiif.w) : 843},/0/default.jpg`;
    o.fondo = o.fondo || `${base}/full/96,/0/default.jpg`;
  }
  if(!o.iw && o.img) await new Promise(res => { const im = new Image(); im.onload = () => { o.iw = im.naturalWidth; o.ih = im.naturalHeight; res(); }; im.onerror = res; im.src = o.img; });
}
function iniciar(){
  KEY = 'uh.' + S.titulo.toLowerCase().replace(/[^a-z0-9]+/g, '') + '.';
  P = {musica:store.get('musica', '0') === '1'};
  U = {caps:[], i:0, si:0, playing:false, started:false, tok:0, timer:0, sel:null, zona:'__', manual:false, gesto:0, dedo:false, asked:new Set(), fin:false, sWhole:1, voz:'guia', callado:false};
  document.title = S.titulo;
  $('musicaB').hidden = !S.musica; $('mMus').textContent = S.musica ? S.musica.titulo : '';
  U.caps = construir();
  let V = null; try{ V = JSON.parse(store.get('visita', '') || 'null'); }catch(e){}
  U.asked = new Set(V && V.a || []); U.i = V && !V.fin ? Math.max(0, Math.min(V.i || 0, U.caps.length - 1)) : 0;
  musicaUI();
  pintarPortada();
  cambiarObra(U.caps[U.i].p, true).then(() => { pintarLista(); centrar(capEl(U.i), false); U.zona = '__'; camaraCap(true); });
}

/* ======================= Las pistas: entrada, una parada por obra, cierre ======================= */
function construir(){
  const out = [], add = (c, p, tipo) => {
    const O = OBRAS[p], segs = [{t:c.t}];
    if(c.c && O.citas && O.citas[c.c]){ const C = O.citas[c.c]; segs.push({t:C.t, voz:C.voz, cita:c.c}); }
    if(c.tras) segs.push({t:c.tras});
    out.push({k:c.k || 'texto', z:c.z === undefined ? null : c.z, segs, p, tipo, pausa:c.pausa});
  };
  const PI = S.portada.obra, enPortada = c => Object.assign({}, c, {z:c.z == null ? '__portada' : c.z});
  (S.intro || []).forEach(c => add(enPortada(c), PI, 'intro'));
  S.paradas.forEach((pa, p) => pa.caps.forEach((c, n) => add(c, p, n === 0 ? 'inicio' : 'obra')));
  (S.cierre || []).forEach((c, n) => add(enPortada(c), PI, n === 0 ? 'cierre' : 'fin'));
  return out;
}
const refHTML = C => { const t = esc(C.breve || C.ref || ''); return `<p class="ref">${C.url ? `<a href="${esc(C.url)}" target="_blank" rel="noopener">${t}</a>` : t}</p>`; };
// Duración aproximada a partir del texto, antes de pintar nada
function duracion(){
  const pal = U.caps.reduce((a, C) => a + C.segs.reduce((b, s) => b + s.t.split(/\s+/).length, 0), 0);
  U.segundos = Math.round(pal/2.5 + U.caps.length*1.2 + U.caps.reduce((a, C) => a + (C.k === 'silencio' ? (C.pausa || 7) : 0), 0));
  return U.segundos < 90 ? `${Math.max(30, Math.round(U.segundos/15)*15)} s` : `${Math.round(U.segundos/60*2)/2} min`.replace('.5', ',5');
}

function pintarLista(){
  const L = $('lista'); U.dur = duracion(); L.innerHTML = '<div class="tope" aria-hidden="true"></div>';
  $('pTexto').querySelectorAll('.cap').forEach(el => el.remove());
  U.caps.forEach((C, i) => {
    const el = document.createElement('div'); el.className = 'cap' + (C.k === 'pregunta' ? ' pregunta' : '') + (C.k === 'silencio' ? ' silencio' : ''); el.dataset.i = i; el.setAttribute('role', 'button'); el.tabIndex = 0;
    C.frases = [];
    C.segs.forEach(s => {
      const box = document.createElement(s.cita ? 'div' : 'p'), host = s.cita ? document.createElement('blockquote') : box;
      host.innerHTML = (s.cita ? '«' + s.t + '»' : s.t).split(/\s+/).map(w => `<span class="w">${esc(w)}</span>`).join(' ');
      if(s.cita){ box.appendChild(host); box.insertAdjacentHTML('beforeend', refHTML(OBRAS[C.p].citas[s.cita])); }
      el.appendChild(box);
      const spans = [...host.querySelectorAll('.w')]; let k = 0;
      SENT(s.t).forEach(f => { const n = f.split(/\s+/).length; C.frases.push({t:f, voz:s.voz, w:spans.slice(k, k + n)}); k += n; });
      if(k < spans.length && C.frases.length) C.frases[C.frases.length - 1].w.push(...spans.slice(k));
    });
    (C.tipo === 'intro' ? $('pTexto') : L).appendChild(el);   // la entrada se cuenta en la portada
  });
  const fin = document.createElement('div'); fin.className = 'fin'; fin.id = 'fin';
  L.appendChild(fin);
  L.insertAdjacentHTML('beforeend', '<div class="cola" aria-hidden="true"></div>');
  marcarActual(false);
}
const capEl = i => document.querySelector(`.cap[data-i="${i}"]`);
const primeraDe = p => U.caps.findIndex(C => C.p === p && C.tipo === 'inicio');
function foco(){ return Math.round($('lista').clientHeight*.16); }
function marcarActual(scroll = true){
  document.querySelectorAll('.cap[data-i]').forEach(el => { const n = +el.dataset.i; el.classList.toggle('ya', n < U.i); el.classList.toggle('ahora', n === U.i && !U.fin); });
  cabecera(); portada();
  $('fin') && $('fin').classList.toggle('ahora', U.fin);
  if(scroll && !U.dedo) centrar(U.fin ? $('fin') : capEl(U.i));
  estadoPlay();
}
function centrar(el, suave = true){ if(!el || !$('lista').contains(el)) return; const L = $('lista'); L.style.setProperty('--foco', foco() + 'px'); L.scrollTo({top:Math.max(0, el.offsetTop - foco()), behavior:suave && !RM ? 'smooth' : 'auto'}); }
function seguirPalabra(w){
  if(U.dedo || !w || !$('lista').contains(w)) return; const L = $('lista'), y = w.offsetTop - L.scrollTop;
  if(y > L.clientHeight*.66) L.scrollTo({top:w.offsetTop - L.clientHeight*.36, behavior:RM ? 'auto' : 'smooth'});
}

/* ======================= Portada: imagen a sangre, título, tema y Escuchar ======================= */
function pintarPortada(){
  const O = OBRAS[S.portada.obra], e = S.portada.encuadre;
  $('pImg').src = O.img; $('pImg').alt = `${O.titulo}, de ${O.autor}`;
  if(e) $('pImg').style.objectPosition = `${((e[0] + e[2]/2)*100).toFixed(1)}% ${((e[1] + e[3]/2)*100).toFixed(1)}%`;
  $('pTit').textContent = S.titulo; $('pTema').textContent = S.tema;
  $('pTira').innerHTML = OBRAS.map((O, p) => `<button type="button" data-tira="${p}" aria-label="Empezar por la obra ${p + 1}: ${esc(O.titulo)}"><img src="${esc(O.fondo || O.img)}" alt=""><span>${p + 1}. ${esc(O.titulo)}</span></button>`).join('');
}
// Se ve antes de empezar y mientras suena la entrada; se retira al llegar a la primera obra
function portada(){
  if(!U || !U.caps.length) return;
  const C = U.caps[U.i], ver = !U.fin && !U.leyendo && ((!U.started && U.i === 0) || (C && C.tipo === 'intro'));
  const el = $('portadaS'); el.classList.toggle('fuera', !ver); el.setAttribute('aria-hidden', !ver);
  el.classList.toggle('empezada', !!U.started); el.classList.toggle('sonando', U.playing);
  $('pKick').textContent = `Historia · ${OBRAS.length} obras${U.dur ? ' · ' + U.dur : ''}`;
  $('pPlayT').textContent = U.playing ? 'Pausa' : U.started ? 'Seguir' : 'Escuchar'; $('pPlayF').hidden = U.playing;
}
$('pPlay').onclick = () => { if(!U) return; U.playing ? pausa() : play(); };
// Leer: se entra al relato sin voz y se avanza desplazando el texto
$('pLeer').onclick = () => { if(!U) return; U.leyendo = true; portada(); centrar(capEl(U.i), false); U.zona = '__'; camaraCap(true); };
$('pObras').onclick = () => { const t = $('pTira'); t.hidden = !t.hidden; $('pObras').setAttribute('aria-expanded', !t.hidden); };
$('pTira').onclick = e => { const b = e.target.closest('[data-tira]'); if(!b || !U) return; ir(primeraDe(+b.dataset.tira)); if(!U.playing) play(); };
$('pSalir').onclick = () => $('salir').click();

/* ======================= Cambio de obra: fundido y nueva imagen ======================= */
let cambioGen = 0, cambio = null;
function cambiarObra(k, ya){
  if(k === PACT && !ya) return Promise.resolve();
  if(cambio && cambio.k === k) return cambio.pr;
  const g = ++cambioGen;
  const pr = (async () => {
    const st = $('stage');
    if(!ya && !RM && PACT >= 0){ st.style.opacity = 0; await espera(300); if(g !== cambioGen) return; }
    PACT = k; OBRA = OBRAS[k]; IIIF = OBRA._iiif || null;
    cancelAnimationFrame(anim); TES.forEach(im => im.remove()); TES.clear(); marcar(null);
    await new Promise(res => { const pic = $('pic'); let hecho = false; const listo = () => { if(!hecho){ hecho = true; res(); } }; pic.onload = listo; pic.onerror = listo; pic.src = OBRA.img; if(pic.complete && pic.naturalWidth) listo(); setTimeout(listo, 2500); });
    if(g !== cambioGen) return;
    $('pic').alt = `${OBRA.titulo}, de ${OBRA.autor}`; $('unidad').setAttribute('aria-label', $('pic').alt);
    document.querySelectorAll('.fondo').forEach(f => f.style.backgroundImage = `url("${OBRA.fondo || OBRA.img}")`);
    soltarManual(); U.zona = '__'; volar(null, 0);
    st.style.opacity = 1;
    cabecera(); pintarFicha();
  })();
  cambio = {k, pr}; pr.then(() => { if(cambio && cambio.k === k) cambio = null; });
  return pr;
}

/* ======================= Reproducción: voz y texto a la vez ======================= */
function estadoPlay(){
  $('playP').setAttribute('d', U.playing ? 'M7 5h3.5v14H7zM13.5 5H17v14h-3.5z' : 'M7 5l12 7-12 7z');
  const dur = U.segundos < 90 ? `${Math.max(30, Math.round(U.segundos/15)*15)} s` : `${Math.round(U.segundos/60*2)/2} min`.replace('.5', ',5');
  $('playT').textContent = U.playing ? 'Pausa' : U.fin ? 'De nuevo' : U.started || U.i > 0 ? 'Seguir' : `Escuchar · ${dur}`;
  $('play').setAttribute('aria-label', U.playing ? 'Pausar' : 'Escuchar');
  $('unidad').classList.toggle('sonando', U.playing);
  nivelMusica(); portada();
}
function play(){
  if(U.fin){ U.fin = false; U.i = 0; U.si = 0; marcarActual(); camaraCap(true); }
  U.playing = true; U.started = true;
  if(P.musica) musica(true);
  estadoPlay(); sonar(); deriva();
}
function pausa(){ U.playing = false; parar(); estadoPlay(); }
function parar(){ clearTimeout(U.timer); clearInterval(U.reloj); U.tok++; U.callado = false; callar(); }
$('play').onclick = () => { if(!U) return; U.playing ? pausa() : play(); };
function ir(n, retardo = 0){
  parar(); U.fin = false; U.i = Math.max(0, Math.min(n, U.caps.length - 1)); U.si = 0;
  limpiarPalabras(U.caps[U.i]); marcarActual(); camaraCap(true); guardar();
  if(U.playing){ const tok = U.tok; U.timer = setTimeout(() => { if(tok === U.tok && U.playing) sonar(); }, retardo); }
}
function limpiarPalabras(C){ if(C) C.frases.forEach(f => f.w.forEach(w => w.classList.remove('on'))); }
function encender(f, n){ const ws = f.w.slice(0, n == null ? f.w.length : n); ws.forEach(w => w.classList.add('on')); seguirPalabra(ws[ws.length - 1]); }
function sonar(){
  const C = U.caps[U.i]; if(!C) return terminar();
  if(U.si === 0){ limpiarPalabras(C); camaraCap(); }
  C.frases.slice(0, U.si).forEach(f => encender(f));
  const tok = ++U.tok;
  // Un silencio: la frase se ve entera, nadie habla, la música sube un poco y se mira
  if(C.k === 'silencio' && U.si === 0){
    C.frases.forEach(f => encender(f)); U.si = C.frases.length; U.callado = true; nivelMusica();
    U.timer = setTimeout(() => { if(tok !== U.tok || !U.playing) return; U.callado = false; nivelMusica(); sonar(); }, (C.pausa || 7)*1000);
    return;
  }
  if(U.si >= C.frases.length){
    // Respiración entre cápsulas; más larga tras una pregunta y al pasar de una obra a otra
    const sig = U.caps[U.i + 1], espera_ = C.k === 'pregunta' ? 3500 : sig && sig.p !== C.p ? 1800 : 1200;
    U.timer = setTimeout(() => { if(tok !== U.tok || !U.playing) return; if(U.i >= U.caps.length - 1) return terminar(); U.i++; U.si = 0; marcarActual(); guardar(); sonar(); }, espera_);
    return;
  }
  const f = C.frases[U.si];
  decirFrase(f, tok, () => { if(tok !== U.tok) return; encender(f); U.si++; U.timer = setTimeout(() => { if(tok === U.tok && U.playing) sonar(); }, 180); });
}
function terminar(){ parar(); U.playing = false; U.fin = true; guardar(); marcarActual(); marcar(null); U.zona = null; if(!U.manual) volar(null, 1200); }
// Una frase: las palabras se encienden con la voz; si la voz no arranca, el texto sigue a ritmo de lectura
function decirFrase(f, tok, fin){
  clearInterval(U.reloj);
  const vd = (OBRA.voces || {})[f.voz || U.voz] || {pitch:1, rate:1}, rate = vd.rate || 1, ms = 60000/(165*rate);
  let n = 0, conLimites = false, hecho = false, empezo = false, wd = 0;
  const reloj = () => { clearInterval(U.reloj); U.reloj = setInterval(() => { if(tok !== U.tok || conLimites){ clearInterval(U.reloj); return; } n = Math.min(f.w.length - 1, n + 1); encender(f, n + 1); }, ms); };
  const acabar = () => { if(hecho || tok !== U.tok) return; hecho = true; clearTimeout(wd); clearInterval(U.reloj); fin(); };
  const sinVoz = () => { reloj(); clearTimeout(wd); wd = setTimeout(acabar, f.w.length*ms + 500); };
  encender(f, 1);
  if(!window.speechSynthesis) return sinVoz();
  try{
    speechSynthesis.cancel();
    const limpio = HABLA(f.t), u = new SpeechSynthesisUtterance(limpio); u.lang = 'es-ES'; u.rate = rate; u.pitch = vd.pitch || 1;
    const v = vozPara(f.voz || U.voz); if(v) u.voice = v;
    u.onboundary = e => { if(tok !== U.tok || (e.name && e.name !== 'word')) return; conLimites = true; n = limpio.slice(0, e.charIndex + 1).split(/\s+/).filter(Boolean).length; encender(f, n); };
    u.onstart = () => { empezo = true; clearTimeout(wd); wd = setTimeout(acabar, f.w.length*ms*2.5 + 4000); setTimeout(() => { if(!conLimites && tok === U.tok) reloj(); }, 500); };
    u.onend = acabar;
    u.onerror = e => { if(e.error === 'interrupted' || e.error === 'canceled') return; sinVoz(); };
    wd = setTimeout(() => { if(!empezo && tok === U.tok) sinVoz(); }, 1800);
    speechSynthesis.speak(u);
  }catch(e){ sinVoz(); }
}

/* ======================= Relato: tocar o desplazar con el dedo ======================= */
const lista = $('lista');
lista.addEventListener('click', e => {
  if(!U) return;
  if(e.target.closest('a')) return;
  const fq = e.target.closest('[data-fq]'); if(fq){ abrirHablar(); const x = M().qa[+fq.dataset.fq]; U.asked.add(x.q); guardar(); responder(x.q, x, GK()); finPreguntas(); return; }
  const c = e.target.closest('.cap'); if(!c) return;
  const n = +c.dataset.i;
  if(n === U.i && !U.fin){ U.playing ? pausa() : play(); return; }
  ir(n); if(!U.playing) play();
});
lista.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.classList.contains('cap')){ e.preventDefault(); e.target.click(); } });
let asentarT = 0, apuntada = -1, apuntaCamT = 0;
['touchmove','wheel'].forEach(ev => lista.addEventListener(ev, () => { if(!U) return; if(!U.dedo){ U.dedo = true; U.reanudar = U.playing; if(U.playing){ parar(); } lista.classList.add('moviendo'); } }, {passive:true}));
lista.addEventListener('scroll', () => {
  if(!U || !U.dedo) return;
  const n = capEnFoco(); apuntar(n);
  clearTimeout(asentarT); asentarT = setTimeout(asentar, 420);
}, {passive:true});
function capEnFoco(){
  const y = lista.scrollTop + foco() + 24; let mejor = 0, d = 1e9;
  document.querySelectorAll('#lista .cap, #fin').forEach(el => { const top = el.offsetTop, bot = top + el.offsetHeight, dd = y < top ? top - y : y > bot ? y - bot : 0; if(dd < d){ d = dd; mejor = el.id === 'fin' ? 'fin' : +el.dataset.i; } });
  return mejor;
}
function apuntar(n){
  if(n === apuntada) return; apuntada = n;
  document.querySelectorAll('#lista .apunta').forEach(el => el.classList.remove('apunta'));
  const el = n === 'fin' ? $('fin') : capEl(n); el && el.classList.add('apunta');
  clearTimeout(apuntaCamT);
  if(n !== 'fin' && n != null) apuntaCamT = setTimeout(() => {
    const C = U.caps[n]; if(!C || U.manual) return;
    if(C.p !== PACT) cambiarObra(C.p).then(() => { if(apuntada === n || !U.dedo){ U.zona = C.z; enfocar(C.z, 900); } });
    else if(C.z !== U.zona){ U.zona = C.z; enfocar(C.z, 900); }
  }, 160);
}
function asentar(){
  const n = capEnFoco();
  U.dedo = false; lista.classList.remove('moviendo'); apuntar(null); apuntada = -1;
  const seguir = U.reanudar; U.reanudar = false;
  if(n === 'fin'){ terminar(); return; }
  if(n !== U.i || U.fin){ U.playing = seguir; ir(n, 650); }
  else { centrar(capEl(n)); if(seguir){ U.playing = true; const tok = U.tok; U.timer = setTimeout(() => { if(tok === U.tok && U.playing) sonar(); }, 500); } }
  estadoPlay();
}

/* ======================= Cámara ======================= */
let IIIF = null, tesT = 0; const TES = new Map();
function teselas(){ if(IIIF && !tesT) tesT = setTimeout(() => { tesT = 0; pintarTeselas(); }, 160); }
function pintarTeselas(){
  if(!IIIF) return;

function vozPara(k){
  let vs = []; try{ vs = (speechSynthesis.getVoices() || []).filter(x => /^es/i.test(x.lang)); }catch(e){}
  if(!vs.length) return null;
  const fem = /m[oó]nica|paulina|marisol|luc[ií]a|elvira|helena|laura|sabina|paloma|conchita|marta|isabel|female|mujer/i, mas = /jorge|diego|juan|pablo|carlos|enrique|miguel|[aá]lvaro|ra[uú]l|male|hombre/i;
  const quiere = ((OBRA.voces || {})[k] || {}).fem ? fem : mas;
  return vs.find(v => quiere.test(v.name) && /es-ES/i.test(v.lang)) || vs.find(v => quiere.test(v.name)) || vs.find(v => /es-ES/i.test(v.lang)) || vs[0];
}
let hablandoResp = false;
function speak(text, onEnd, k){
  const vd = (OBRA.voces || {})[k] || {pitch:1, rate:1};
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(HABLA(text)); u.lang = 'es-ES'; u.rate = vd.rate || 1; u.pitch = vd.pitch || 1;
    const v = vozPara(k); if(v) u.voice = v;
    u.onstart = () => { hablandoResp = true; nivelMusica(); }; u.onend = () => { hablandoResp = false; nivelMusica(); onEnd && onEnd(); };
    speechSynthesis.speak(u);
  }catch(e){ if(onEnd) setTimeout(onEnd, 3000); }
}
function hablarSeguido(items){ const tok = ++U.tok; let n = 0; const uno = () => { if(tok !== U.tok || n >= items.length) return; const [t, k] = items[n++]; speak(t, () => setTimeout(uno, 350), k); }; uno(); }
// La música es de la historia: sigue sonando al pasar de una obra a otra
let AC = null, MG = null, MSRC = null, MBUF = null, MCARGA = null;
function contexto(){
  if(!AC){ try{ if(navigator.audioSession) navigator.audioSession.type = 'playback'; }catch(e){}
    AC = new (window.AudioContext || window.webkitAudioContext)(); MG = AC.createGain(); MG.gain.value = 0; MG.connect(AC.destination); }
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
function pista(){
  if(MBUF) return Promise.resolve(MBUF);
  if(!MCARGA) MCARGA = fetch(S.musica.src).then(r => r.arrayBuffer()).then(buf => new Promise((res, rej) => AC.decodeAudioData(buf, res, rej))).then(b => (MBUF = b));
  return MCARGA;
}
function musica(on){
  if(!S.musica) return;
  if(on){
    try{ contexto(); }catch(e){ toast('Este navegador no puede reproducir la música'); return; }
    pista().then(b => { if(!P.musica || MSRC) return; MSRC = AC.createBufferSource(); MSRC.buffer = b; MSRC.loop = true; MSRC.connect(MG); MSRC.start(); nivelMusica(); }).catch(() => toast('No se pudo reproducir la música'));
  } else if(AC){ MG.gain.setTargetAtTime(0, AC.currentTime, .4); const s = MSRC; MSRC = null; setTimeout(() => { try{ s && s.stop(); }catch(e){} }, 1600); }
}
// Baja mientras se habla; sube en silencio y en los momentos de solo mirar
function nivelMusica(){ if(AC && MG && P && P.musica && MSRC) MG.gain.setTargetAtTime((U.playing && !U.callado) || hablandoResp ? .3 : .6, AC.currentTime, .5); }
function musicaUI(){ $('musicaB').setAttribute('aria-pressed', P.musica); }
$('musicaB').onclick = () => { P.musica = !P.musica; store.set('musica', P.musica ? '1' : '0'); musicaUI(); musica(P.musica); toast(P.musica ? `Música: ${S.musica.titulo}` : 'Sin música'); };
document.addEventListener('visibilitychange', () => { if(document.hidden){ if(U && U.playing) pausa(); if(AC) AC.suspend(); } else if(AC && P && P.musica) AC.resume(); });

function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2600); }
addEventListener('keydown', e => {
  if(!U) return;
  const abierta = ['ajS','fichaS','hablarS'].find(id => !$(id).hidden);
  if(e.key === 'Escape'){ if(abierta) cierres[abierta](); return; }
  if(abierta || (e.target.closest && e.target.closest('input'))) return;
  if(e.key === ' '){ e.preventDefault(); $('play').click(); }
  if(e.key === 'ArrowDown' || e.key === 'ArrowRight'){ e.preventDefault(); ir(U.i + 1, 300); }
  if(e.key === 'ArrowUp' || e.key === 'ArrowLeft'){ e.preventDefault(); ir(U.i - 1, 300); }
});

(async () => {
  let q = null; try{ q = new URLSearchParams(location.search).get('historia'); }catch(e){}
  let u = new URL(q || HISTORIA, location.href);
  if(q && u.origin !== location.origin) u = new URL(HISTORIA, location.href);
  try{ await cargarHistoria(u.href); }catch(e){ toast('No se pudo cargar la historia'); }
})();
