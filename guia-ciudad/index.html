<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111c18">
<title>Guía de la ciudad · Hello Heritage</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500&family=Space+Grotesk:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Hello Heritage · guía de ciudad. Sistema visual de la web v4: verde oscuro, lima, Space Grotesk + Manrope + Roboto Flex, formas de Material 3 Expressive.
   Datos en vivo: Wikipedia (es), Wikidata (SPARQL), OpenStreetMap (Overpass), Wikimedia Commons. Guía generativo opcional con Gemini. */
:root{--bg:#111c18;--bg2:#16221d;--sf:#1d2c26;--sf2:#25372f;--ink:#f1f2e9;--ink2:#bbc6bb;--lime:#dcff85;--line:rgba(241,242,233,.12);--sheet:56vh;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--lime)}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.ui{font-family:'Roboto Flex',system-ui,sans-serif}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--bg);border-bottom:1px solid var(--line);z-index:20}
.brand{flex:1;line-height:1.15}
.brand h1{font:600 24px/1.05 'Space Grotesk',sans-serif;letter-spacing:-.025em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{font:13px 'Roboto Flex',sans-serif;color:var(--ink2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--sf);border-radius:999px;padding:3px;flex:none}
.seg button{border:0;background:none;padding:0 14px;height:38px;border-radius:999px;font:500 14px 'Roboto Flex',sans-serif;color:var(--ink2);transition:border-radius .25s,background .25s}
.seg button[aria-pressed=true]{background:var(--lime);color:#111c18;border-radius:12px}
.icon{flex:none;width:44px;height:44px;border-radius:16px;border:0;background:var(--sf);display:grid;place-items:center;color:var(--ink)}
.icon svg{width:22px;height:22px}
.icon.on{background:var(--lime);color:#111c18}
main{position:relative;overflow:hidden}
#map{position:absolute;inset:0;background:#0c1411}
.leaflet-container{font:13px 'Roboto Flex',sans-serif;background:#0c1411}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.9) saturate(.35) sepia(.15)}
.leaflet-control-attribution{background:rgba(17,28,24,.75)!important;color:var(--ink2)!important}
.leaflet-control-attribution a{color:var(--ink2)!important}
.leaflet-tooltip{background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:10px;font:13px 'Roboto Flex',sans-serif;box-shadow:none}
.leaflet-tooltip-top:before{border-top-color:var(--bg2)}
.leaflet-tooltip.num{background:var(--lime);color:#111c18;border:0;font-weight:500;padding:1px 7px}
.leaflet-tooltip.num:before{display:none}
#pill{position:absolute;top:12px;left:12px;z-index:500;border:0;border-radius:999px;background:var(--lime);color:#111c18;height:40px;padding:0 16px;font:500 14px 'Roboto Flex',sans-serif}
#vTemas{position:absolute;inset:0;overflow:auto;background:var(--bg);padding:16px max(12px,3vw) calc(var(--sheet) + 24px);z-index:1000}
.vt-h{font:600 28px/1.1 'Space Grotesk',sans-serif;letter-spacing:-.02em;margin:4px 0 16px;text-wrap:balance}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:10px;align-items:start}
.theme{background:var(--bg2);border-radius:24px;overflow:hidden}
.th-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:10px 14px 10px 10px}
.th-name{font:600 18px/1.15 'Space Grotesk',sans-serif;display:block}
.th-sample{font:13px/1.35 'Roboto Flex',sans-serif;color:var(--ink2);display:block;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.th-n{font:500 14px 'Roboto Flex',sans-serif;background:var(--sf2);border-radius:999px;padding:4px 10px}
.th-body{padding:0 10px 12px}
.th-actions{display:flex;gap:8px;flex-wrap:wrap;padding:2px 4px 8px}
.th-list{list-style:none;margin:0;padding:0;max-height:340px;overflow:auto}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 6px;border-top:1px solid var(--line);min-height:56px}
.r-n{display:block;font-weight:600;font-size:15px}
.r-m{display:block;font:13px 'Roboto Flex',sans-serif;color:var(--ink2)}
.btn{border:1px solid var(--line);background:var(--sf);border-radius:999px;height:40px;padding:0 16px;font:500 14px 'Roboto Flex',sans-serif}
.btn.pri{background:var(--lime);color:#111c18;border-color:transparent}
#sheet{position:fixed;left:0;right:0;bottom:0;height:var(--sheet);background:var(--bg2);border-radius:28px 28px 0 0;display:flex;flex-direction:column;z-index:1100;box-shadow:0 -10px 30px rgba(0,0,0,.4);transition:height .35s cubic-bezier(.2,.9,.25,1.15)}
#sheet[data-size=max]{height:calc(100% - 64px - env(safe-area-inset-top))}
#grab{flex:none;height:22px;border:0;background:none;display:grid;place-items:center;width:100%}
#grab::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line)}
#card:empty{display:none}
.card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;padding:0 14px 10px;border-bottom:1px solid var(--line);align-items:start}
.card h2{font:600 20px/1.15 'Space Grotesk',sans-serif;letter-spacing:-.01em;margin:0 0 3px;text-wrap:balance}
.meta{font:13px/1.4 'Roboto Flex',sans-serif;color:var(--ink2)}
.her{display:inline-block;margin:6px 0 0;font:500 12px/1.3 'Roboto Flex',sans-serif;color:#111c18;background:var(--lime);border-radius:8px;padding:2px 8px}
.x{width:36px;height:36px;border-radius:12px;border:0;background:var(--sf);font-size:18px;line-height:1}
#log{flex:1;overflow:auto;padding:6px 14px 4px;position:relative;overscroll-behavior:contain}
.msg{margin:10px 0}
.msg.u{text-align:right}
.msg.u .b{display:inline-block;background:var(--sf2);padding:9px 14px;border-radius:22px 22px 6px 22px;max-width:86%;text-align:left}
.msg.g{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.av{width:28px;height:28px;margin-top:2px}
.msg.g .t p{margin:0 0 9px}
.think .av{animation:turn 4s linear infinite}
.think .t{color:var(--ink2);font:14px 'Roboto Flex',sans-serif;padding-top:4px}
@keyframes turn{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.think .av{animation:none}#sheet{transition:none}}
.src{font:12px 'Roboto Flex',sans-serif;color:var(--ink2);margin-top:2px}
.note{text-align:center;font:13px 'Roboto Flex',sans-serif;color:var(--ink2);margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.pc{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sf);border-radius:14px;padding:6px 12px 6px 8px;min-height:44px;text-align:left;font:14px/1.25 'Roboto Flex',sans-serif}
.ph{position:relative;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--c);color:#111c18;font:600 15px/1 'Space Grotesk',sans-serif;width:44px;height:44px;border-radius:14px}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.xl{width:68px;height:68px;border-radius:22px;font-size:22px}
.ph.l{width:64px;height:64px;border-radius:18px;font-size:22px}
.ph.s{width:32px;height:32px;border-radius:11px;font-size:12px}
.pc i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--lime);color:#111c18;font:500 12px/22px 'Roboto Flex',sans-serif;text-align:center;font-style:normal}
.pc small{display:block;color:var(--ink2);font-size:12px}
#sugs{display:flex;gap:6px;overflow-x:auto;padding:0 14px 2px;flex:none;scrollbar-width:none}
#sugs:empty{display:none}
#sugs button{flex:none;max-width:80vw;border:1px solid rgba(220,255,133,.35);background:none;color:var(--lime);border-radius:999px;padding:0 14px;height:40px;font:14px 'Roboto Flex',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ask{display:flex;gap:8px;padding:8px 12px 4px;flex:none}
#q{flex:1;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--sf);padding:0 18px;font-size:16px}
#q::placeholder{color:var(--ink2)}
#send{flex:none;width:48px;height:48px;border-radius:16px;border:0;background:var(--lime);color:#111c18;display:grid;place-items:center;transition:border-radius .25s}
#send:hover,#send:focus-visible{border-radius:50%}
#send:disabled{opacity:.4}
.powered{flex:none;text-align:center;font:12px 'Roboto Flex',sans-serif;color:var(--ink2);padding:2px 12px calc(6px + env(safe-area-inset-bottom))}
dialog{background:var(--bg2);color:var(--ink);border:0;border-radius:28px;padding:20px;width:min(92vw,440px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font:600 22px 'Space Grotesk',sans-serif;margin:0 0 12px}
dialog label{display:block;font:500 14px 'Roboto Flex',sans-serif;margin:12px 0 4px;color:var(--ink2)}
dialog input,dialog select{display:block;width:100%;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--sf);padding:0 14px;font-size:16px;margin-top:4px}
.hint{font:13px/1.45 'Roboto Flex',sans-serif;color:var(--ink2);margin:6px 0 0}
.dl-a{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(min-width:900px){
  :root{--sheet:0px}
  #app{grid-template-columns:minmax(0,1fr) 420px}
  .top{grid-column:1/-1}
  #sheet{position:relative;grid-column:2;grid-row:2;height:auto;border-radius:0;box-shadow:none;border-left:1px solid var(--line);transition:none}
  #grab{display:none}
  .card{padding-top:14px}
}
@media(max-width:899px){body.v-temas{--sheet:30vh}body.v-temas #card{display:none}}
@media(min-width:900px){#sugs{flex-wrap:wrap}#sugs button{max-width:100%}}
@media(max-width:420px){.brand h1{font-size:20px}.seg button{padding:0 11px}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><h1 id="cityName">Guía</h1><span id="status">Cargando…</span></div>
    <nav class="seg" aria-label="Vista"><button type="button" data-v="mapa" aria-pressed="true">Mapa</button><button type="button" data-v="temas" aria-pressed="false">Temas</button></nav>
    <button type="button" class="icon" id="btnLoc" aria-label="Dónde estoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    <button type="button" class="icon" id="btnCfg" aria-label="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </header>
  <main>
    <div id="map" role="application" aria-label="Mapa de lugares"></div>
    <button type="button" id="pill" hidden></button>
    <section id="vTemas" hidden aria-label="Temas"></section>
  </main>
  <aside id="sheet" data-size="min" aria-label="Guía">
    <button type="button" id="grab" aria-label="Ampliar o reducir la conversación"></button>
    <div id="card"></div>
    <div id="log" aria-live="polite"></div>
    <div id="sugs"></div>
    <form id="ask" autocomplete="off"><input id="q" enterkeyhint="send" placeholder="Pregunta al guía…" aria-label="Pregunta al guía"><button id="send" aria-label="Enviar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></form>
    <div class="powered">powered by Hello Heritage</div>
  </aside>
</div>
<dialog id="cfg"><form method="dialog" id="cfgForm">
  <h2>Ajustes</h2>
  <label>Ciudad<input name="ciudad" required></label>
  <label>Modelo<select name="modelo"><option value="haiku">Claude Haiku · rápido</option><option value="sonnet">Claude Sonnet · más fino, más lento</option></select></label>
  <p class="hint">Responde a través de tu intermediario, con Perplexity: las claves no pasan por el navegador.</p>
  <div class="dl-a"><button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn pri" value="ok">Guardar</button></div>
</form></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
{
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const STOP = new Set(('el la los las lo un una unos unas de del al a y o u e en con por para que como es son fue era hay me te se le les su sus mi tu yo este esta esto estos estas ese esa eso aqui alli muy mas pero sobre entre cual quien donde cuando porque ya ha han hace tiene puedo dime cuentame hablame algo the of and to in is what who where').split(' '));
const terms = s => fold(s).split(/[^a-z0-9]+/).filter(w => w.length > 2 && !STOP.has(w)).map(w => w.slice(0, 5));
const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const clip = (s, n) => s && s.length > n ? s.slice(0, n).replace(/\s+\S*$/, '') + ' […]' : (s || '');
const strip = s => String(s || '').replace(/<[^>]+>/g, '');
const RAD = Math.PI / 180;
const dist = (a, b) => { const x = Math.sin((b.lat - a.lat) * RAD / 2) ** 2 + Math.cos(a.lat * RAD) * Math.cos(b.lat * RAD) * Math.sin((b.lon - a.lon) * RAD / 2) ** 2; return 12742000 * Math.asin(Math.sqrt(x)); };
const meters = m => m < 950 ? Math.round(m / 10) * 10 + ' m' : (m / 1000).toFixed(1).replace('.', ',') + ' km';

const params = new URLSearchParams(location.search);
const saved = LS.get('hh.cfg', {});
const cfg = { ciudad: saved.ciudad || 'Cádiz', modelo: saved.modelo === 'sonnet' ? 'sonnet' : 'haiku' };
if (params.get('ciudad')) cfg.ciudad = params.get('ciudad');
if (['haiku', 'sonnet'].includes(params.get('modelo'))) cfg.modelo = params.get('modelo');
// El intermediario de artmedium (intermediario/worker.js): guarda las claves y llama a Haiku o Sonnet por Perplexity
const IA = 'https://artmedium-ia.alberto-studio76.workers.dev';
const THEME_COL = { 'Arqueología': '#e2b77d', 'Fortificaciones': '#cdbb9b', 'Iglesias y conventos': '#bfaeea', 'Torres': '#9fd3e6', 'Monumentos y esculturas': '#f0d36c', 'Museos y teatros': '#f2a8bd', 'Mar y playas': '#86c9f5', 'Parques y jardines': '#a3dc9e', 'Plazas y calles': '#e8c994', 'Palacios y edificios': '#c9ceaa', 'Otros': '#aab5af' };

const THEMES = [
  ['Arqueología', /yacimiento|arqueol|fenic|romano|romana|necropolis|ruina|gadir|hipogeo|sarcofago|salazon|anfiteatro/],
  ['Fortificaciones', /castillo|fortaleza|fortific|fuerte|baluarte|muralla|puerta de|puertas de|bateria|bastion|revellin|canon|polvorin|bunker|fort\b|city gate/],
  ['Iglesias y conventos', /iglesia|catedral|capilla|convento|monasterio|oratorio|ermita|templo|parroquia|santuario|cripta|basilica|sinagoga|mezquita|church|cathedral/],
  ['Torres', /torre|tower/],
  ['Monumentos y esculturas', /monumento|estatua|escultura|busto|memorial|obra de arte|fuente|placa|grupo escult|mural|cruz|relieve|ancla|statue|sculpture|artwork|monument/],
  ['Museos y teatros', /museo|teatro|biblioteca|archivo|galeria|cine|auditorio|centro cultural|casino|ateneo|museum|theatre/],
  ['Mar y playas', /playa|isla|islote|bahia|puerto|muelle|caleta|punta|cabo|dique|balneario|faro|barco|buque|navio|marisma|salina|ensenada|beach|lighthouse/],
  ['Parques y jardines', /parque|jardin|alameda|arbol|ficus|drago|bosque|park|garden/],
  ['Plazas y calles', /plaza|calle|avenida|paseo|barrio|plazuela|callejon|glorieta|distrito|square|street/],
  ['Palacios y edificios', /palacio|casa|edificio|mansion|hospital|aduana|ayuntamiento|carcel|cuartel|mercado|estacion|hotel|colegio|universidad|escuela|instituto|fabrica|banco|sede|residencia|vivienda|hospicio|tribunal|diputacion|lonja|pabellon|arquitect|building|palace/]
];
const THEME_NAMES = [...THEMES.map(t => t[0]), 'Otros'];
const OSM_ES = { statue: 'estatua', sculpture: 'escultura', bust: 'busto', memorial: 'memorial', monument: 'monumento', plaque: 'placa', castle: 'castillo', fort: 'fuerte', city_gate: 'puerta de la ciudad', ruins: 'ruinas', archaeological_site: 'yacimiento arqueológico', church: 'iglesia', building: 'edificio histórico', fountain: 'fuente', wayside_cross: 'cruz', cannon: 'cañón', mural: 'mural', tower: 'torre', ship: 'barco', anchor: 'ancla', bunker: 'búnker', manor: 'casa señorial', palace: 'palacio', artwork: 'obra de arte', relief: 'relieve', installation: 'instalación', stone: 'piedra', tomb: 'tumba', mosaic: 'mosaico', war_memorial: 'monumento a los caídos', boundary_stone: 'mojón', milestone: 'miliario', lighthouse: 'faro', wreck: 'pecio', yes: '' };

const state = { city: null, places: [], byId: new Map(), sel: null, secs: null, shownSecs: new Set(), filter: null, me: null, chat: [], busy: false, articles: new Map() };

/* ---------- Fuentes abiertas ---------- */
async function getJSON(url, opt = {}, ms = 30000) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, { ...opt, signal: c.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
const wp = p => getJSON('https://es.wikipedia.org/w/api.php?' + new URLSearchParams({ format: 'json', formatversion: '2', origin: '*', ...p }));

async function resolveCity(name) {
  const j = await wp({ action: 'query', titles: name, redirects: '1', prop: 'pageprops|coordinates|extracts', ppprop: 'wikibase_item', exintro: '1', explaintext: '1' });
  const p = j.query?.pages?.[0];
  if (!p || p.missing || !p.pageprops?.wikibase_item) throw new Error('No encuentro «' + name + '» en Wikipedia');
  const c = p.coordinates?.[0] || {};
  return { name: p.title, qid: p.pageprops.wikibase_item, lat: c.lat, lon: c.lon, intro: p.extract || '' };
}

async function loadWikidata(qid) {
  const q = `SELECT ?item ?label ?desc ?coord (SAMPLE(?img) AS ?image) (SAMPLE(?art) AS ?es) (SAMPLE(?enart) AS ?en)
 (GROUP_CONCAT(DISTINCT ?tl; separator="|") AS ?types) (GROUP_CONCAT(DISTINCT ?hl; separator="|") AS ?her)
 (GROUP_CONCAT(DISTINCT ?al; separator="|") AS ?auth) (MIN(YEAR(?inc)) AS ?year) WHERE {
 { SELECT DISTINCT ?item WHERE { ?item wdt:P131+ wd:${qid} ; wdt:P625 [] .
   FILTER(EXISTS{?item wdt:P1435 []} || EXISTS{?item wdt:P18 []} || EXISTS{?a0 schema:about ?item ; schema:isPartOf <https://es.wikipedia.org/>}) } LIMIT 1500 }
 ?item wdt:P625 ?coord .
 OPTIONAL{?item wdt:P18 ?img} OPTIONAL{?art schema:about ?item ; schema:isPartOf <https://es.wikipedia.org/>}
 OPTIONAL{?enart schema:about ?item ; schema:isPartOf <https://en.wikipedia.org/>}
 OPTIONAL{?item wdt:P31 ?t} OPTIONAL{?item wdt:P1435 ?h} OPTIONAL{?item wdt:P170|wdt:P84 ?a} OPTIONAL{?item wdt:P571 ?inc}
 SERVICE wikibase:label { bd:serviceParam wikibase:language "es,en". ?item rdfs:label ?label . ?item schema:description ?desc . ?t rdfs:label ?tl . ?h rdfs:label ?hl . ?a rdfs:label ?al . }
} GROUP BY ?item ?label ?desc ?coord LIMIT 1200`;
  const j = await getJSON('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(q), {}, 55000);
  const v = b => b?.value, split = s => s ? s.split('|').filter(Boolean) : [], title = u => u ? decodeURIComponent(u.split('/wiki/')[1] || '').replace(/_/g, ' ') : '';
  const seen = new Set(), out = [];
  for (const b of j.results.bindings) {
    const id = v(b.item).split('/').pop(), m = /Point\(([-\d.eE]+) ([-\d.eE]+)\)/.exec(v(b.coord) || '');
    if (seen.has(id) || !m) continue;
    const name = v(b.label) || id, es = title(v(b.es));
    if (/^Q\d+$/.test(name) && !es) continue;
    seen.add(id);
    out.push({ id, name: /^Q\d+$/.test(name) ? es : name, desc: v(b.desc) || '', lat: +m[2], lon: +m[1],

async function loadCatalog() {

// Fotos: la de Wikidata (P18) y, si no hay, la principal del artículo de Wikipedia, de 50 en 50
async function fillImages(run) {

// El intermediario no da herramientas al modelo: la página reúne antes lo que el guía necesita saber
// (el lugar abierto, los lugares que casan con la pregunta, lo cercano y Wikipedia) y se lo manda en una sola llamada.
const placeLine = p => [p.name, [p.types.join(', '), p.year, p.auth.join(', '), p.her[0]].filter(Boolean).join(' · '), p.desc, 'a ' + meters(dist(refPoint(), p))].filter(Boolean).join(' — ');
async function intros(titles) {
  const out = {};
  for (let i = 0; i < titles.length; i += 20) {
    const j = await wp({ action: 'query', prop: 'extracts', exintro: '1', explaintext: '1', exlimit: '20', redirects: '1', titles: titles.slice(i, i + 20).join('|') }).catch(() => null);
    const alias = {};
    for (const r of [...(j?.query?.normalized || []), ...(j?.query?.redirects || [])]) alias[r.to] = r.from;
    for (const pg of j?.query?.pages || []) if (pg.extract) { let t = pg.title; while (t && !out[t]) { out[t] = pg.extract; t = alias[t]; } }
  }
  return out;
}
async function gatherContext(q) {
  const sel = state.sel, fq = fold(q), hits = searchPlaces(q, { limit: 8 }).filter(p => p !== sel);
  const theme = THEME_NAMES.find(n => fq.includes(fold(n)));
  const kw = fq.split(/[^a-z0-9]+/).filter(w => w.length > 3 && !STOP.has(w)).slice(0, 4).join(' ');
  const [srch, selTxt] = await Promise.all([
    kw ? wp({ action: 'query', list: 'search', srsearch: kw + ' ' + state.city.name, srlimit: '4', srprop: '' }).catch(() => null) : null,
    sel?.article ? article(sel.article).catch(() => '') : ''
  ]);
  const extra = (srch?.query?.search || []).map(x => x.title).filter(t => t !== sel?.article && t !== state.city.name && !hits.some(p => p.article === t)).slice(0, 3);
  const txt = await intros([...hits.map(p => p.article).filter(Boolean).slice(0, 6), ...extra]);
  const out = [];
  if (sel) out.push(`EL LUGAR QUE TIENE ABIERTO EN PANTALLA\n${placeLine(sel)}\n${clip(selTxt, 14000)}`);
  if (theme) out.push(`LUGARES DEL TEMA «${theme}»\n` + state.places.filter(p => p.theme === theme).sort((a, b) => b.imp - a.imp).slice(0, 14).map(placeLine).join('\n'));
  if (hits.length) out.push('LUGARES DEL CATÁLOGO QUE CASAN CON LO QUE DICE\n' + hits.map(p => placeLine(p) + (txt[p.article] ? '\n' + clip(txt[p.article], 700) : '')).join('\n\n'));
  const ex = extra.filter(t => txt[t]);
  if (ex.length) out.push('OTROS ARTÍCULOS DE WIKIPEDIA\n' + ex.map(t => `«${t}»: ${clip(txt[t], 900)}`).join('\n\n'));
  out.push('CERCA DE ' + (sel ? '«' + sel.name + '»' : state.me ? 'LA PERSONA' : 'EL CENTRO') + '\n' + nearest(sel || refPoint(), 8).map(([p, d]) => `${p.name} (${p.types[0] || p.theme}) a ${meters(d)}`).join('; '));
  return out.join('\n\n');
}
function systemPrompt(ctx) {
  const c = state.city, now = new Date().toLocaleString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  const counts = THEME_NAMES.map(n => [n, state.places.filter(p => p.theme === n).length]).filter(x => x[1]).map(x => `${x[0]} (${x[1]})`).join(', ');
  const top = [...state.places].sort((a, b) => b.imp - a.imp).slice(0, 30).map(p => p.name).join('; ');
  let where = 'No sé dónde está: quizá prepara el paseo desde casa.';
  if (state.me) { const n = nearest(state.me, 1)[0]; where = dist(state.me, c) < 30000 ? `Está en la calle, a ${meters(n[1])} de «${n[0].name}».` : `Está lejos de ${c.name}: prepara el paseo.`; }
  return `Eres un intérprete del patrimonio de ${c.name}, en la tradición de Freeman Tilden. Conoces la ciudad a fondo y acompañas a una persona que la recorre o prepara su paseo.

Antes de cada respuesta, pregúntate: desde esa mirada y con lo que conozco, ¿qué puede surgir entre esta persona y yo?

Lo que conoces de la ciudad te llega aquí debajo, renovado en cada turno: el catálogo de lugares, sacado de Wikidata y OpenStreetMap, y textos de Wikipedia.

Cómo funciona la aplicación: cuando nombras un lugar tal como aparece en el catálogo, se señala en el mapa; al final, dos o tres preguntas que la persona podría hacerte ahora, cada una en su propia línea, empezando por ›.

Ahora: ${now}. Idioma del navegador: ${navigator.language}.
${where}
El catálogo tiene ${state.places.length} lugares, por temas: ${counts}.
Algunos de los más documentados: ${top}.
Resumen de Wikipedia sobre la ciudad: ${clip(c.intro, 1200)}

${ctx}`;
}
// Los lugares del catálogo que nombra la respuesta, en el orden en que aparecen: van al mapa y como tarjetas
function mentioned(body) {
  const f = ' ' + fold(body).replace(/[^a-z0-9]+/g, ' ') + ' ', found = [], names = new Set();
  for (const p of [...state.places].sort((a, b) => b.name.length - a.name.length)) {
    const n = ' ' + fold(p.name).replace(/[^a-z0-9]+/g, ' ').trim() + ' ', i = f.indexOf(n);
    if (n.length < 8 || i < 0 || names.has(n) || found.some(x => i < x.i + x.len && x.i < i + n.length)) continue;
    names.add(n); found.push({ p, i, len: n.length });
  }
  return found.sort((a, b) => a.i - b.i).slice(0, 6).map(x => x.p);
}
async function guideTurn(q, hidden = false) {
  state.busy = true; $('#send').disabled = true; setSugs([]);
  const m = thinking('Leyendo Wikipedia…');
  try {
    const ctx = await gatherContext(q);
    m.querySelector('.t').textContent = 'Pensando…';
    // El intermediario pasa al modelo los 12 últimos mensajes: el prompt con el contexto, cuatro intercambios y la pregunta
    const input = [{ role: 'user', content: clip(systemPrompt(ctx), 42000) }, ...state.chat.slice(-8).map(t => ({ role: t.role, content: clip(t.content, 1800) })), { role: 'user', content: q }];
    const c = new AbortController(), t = setTimeout(() => c.abort(), 60000);
    let r, txt;
    try { r = await fetch(IA, { method: 'POST', signal: c.signal, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ input, modelo: cfg.modelo }) }); txt = await r.text(); }
    finally { clearTimeout(t); }
    if (!r.ok) throw new Error(txt.slice(0, 140) || 'HTTP ' + r.status);
    const { body, sugs } = splitSugs(txt.trim()), ps = mentioned(body);
    state.chat.push({ role: 'user', content: q }, { role: 'assistant', content: body });
    done(m, md(body), '', ps);
    if (ps.length && !(ps.length === 1 && ps[0] === state.sel)) showOnMap(ps, false);
    setSugs(sugs);
  } catch (e) {
    m.remove();
    addMsg('note', `El guía no responde (${esc(e.name === 'AbortError' ? 'tarda demasiado' : e.message)}). Te leo Wikipedia.`);
    state.busy = false;
    if (hidden && state.sel) await readerIntro(state.sel); else await readerAnswer(q);
  } finally { state.busy = false; $('#send').disabled = false; }
}

function ask(q) {
  q = q.trim(); if (!q || state.busy || !state.city) return;
  addMsg('u', esc(q)); $('#q').value = '';
  guideTurn(q);
}

/* ---------- Temas ---------- */
function renderThemes() {
  const g = new Map();
  for (const p of state.places) { if (!g.has(p.theme)) g.set(p.theme, []); g.get(p.theme).push(p); }
  const order = THEME_NAMES.filter(n => g.has(n));
  $('#vTemas').innerHTML = `<h2 class="vt-h">${esc(state.city.name)}: ${state.places.length} lugares en ${order.length} temas</h2><div class="themes">` + order.map(n => {
    const ps = g.get(n).sort((a, b) => b.imp - a.imp), withImg = ps.find(p => p.img);
    return `<article class="theme" data-t="${esc(n)}"><button type="button" class="th-head" aria-expanded="false">${withImg ? avatar(withImg, 'l', 200) : `<span class="ph l" style="--c:${THEME_COL[n]}" aria-hidden="true">${esc(n[0])}</span>`}<span><span class="th-name">${esc(n)}</span><span class="th-sample">${esc(ps.slice(0, 3).map(p => p.name).join(' · '))}</span></span><span class="th-n">${ps.length}</span></button>
      <div class="th-body" hidden><div class="th-actions"><button type="button" class="btn" data-act="map">Ver en el mapa</button><button type="button" class="btn pri" data-act="route">Recorrido</button></div>
      <ul class="th-list">${ps.slice(0, 80).map(p => `<li><button type="button" class="row" data-id="${esc(p.id)}">${avatar(p, '', 120)}<span><span class="r-n">${esc(p.name)}</span><span class="r-m">${esc(metaLine(p))}</span></span></button></li>`).join('')}</ul></div></article>`;
  }).join('') + '</div>';
}
function themeRoute(n) {
  showView('mapa');
  ask(`Propónme un recorrido corto a pie por el tema «${n}».`);
}
function showView(v) {
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  $('#vTemas').hidden = v !== 'temas';
  document.body.classList.toggle('v-temas', v === 'temas');
  if (innerWidth < 900) { $('#sheet').dataset.size = 'min'; $('#q').blur(); }
}
const setStatus = s => $('#status').textContent = s;

/* ---------- Eventos ---------- */
$('.seg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) showView(b.dataset.v); });
$('#vTemas').addEventListener('click', e => {
  const row = e.target.closest('.row'); if (row) return openPlace(row.dataset.id);
  const art = e.target.closest('.theme'); if (!art) return;
  const n = art.dataset.t, act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'map') { state.filter = n; drawMarkers(); showView('mapa'); const ps = state.places.filter(p => p.theme === n); if (ps.length) map.flyToBounds(ps.map(p => [p.lat, p.lon]), { paddingTopLeft: [30, 60], paddingBottomRight: [30, sheetPx()], maxZoom: 17 }); return; }
  if (act === 'route') return themeRoute(n);
  if (e.target.closest('.th-head')) { const body = art.querySelector('.th-body'), open = body.hidden; body.hidden = !open; art.querySelector('.th-head').setAttribute('aria-expanded', open); }
});
$('#pill').addEventListener('click', () => { state.filter = null; drawMarkers(); });
log.addEventListener('click', e => { const c = e.target.closest('.pc'); if (c) openPlace(c.dataset.id); });
$('#card').addEventListener('click', e => { if (e.target.closest('#closeCard')) { state.sel = null; $('#card').innerHTML = ''; markSel(null); } });
$('#sugs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) ask(b.textContent); });
$('#ask').addEventListener('submit', e => { e.preventDefault(); ask($('#q').value); });
$('#q').addEventListener('focus', () => { if (innerWidth < 900) $('#sheet').dataset.size = 'max'; });
$('#grab').addEventListener('click', () => { const s = $('#sheet'); s.dataset.size = s.dataset.size === 'max' ? 'min' : 'max'; });
map.on('click', () => { if (innerWidth < 900) $('#sheet').dataset.size = 'min'; });
$('#btnLoc').addEventListener('click', () => {
  if (!navigator.geolocation) return addMsg('note', 'Este navegador no da la ubicación.');
  navigator.geolocation.getCurrentPosition(pos => {
    state.me = { lat: pos.coords.latitude, lon: pos.coords.longitude, name: 'tu posición' };
    meLayer.clearLayers(); L.circleMarker([state.me.lat, state.me.lon], { radius: 8, weight: 3, color: '#111c18', fillColor: '#ffffff', fillOpacity: 1 }).addTo(meLayer);
    $('#btnLoc').classList.add('on');
    if (state.city && dist(state.me, state.city) < 30000) map.flyTo([state.me.lat, state.me.lon], 17); else addMsg('note', `Estás lejos de ${esc(state.city?.name || 'la ciudad')}: mido las distancias desde el centro.`);
  }, () => addMsg('note', 'No he podido saber dónde estás.'), { enableHighAccuracy: true, timeout: 12000 });
});
const dlg = $('#cfg'), f = $('#cfgForm');
$('#btnCfg').addEventListener('click', () => { f.ciudad.value = cfg.ciudad; f.modelo.value = cfg.modelo; dlg.showModal(); });
dlg.addEventListener('close', () => {
  if (dlg.returnValue !== 'ok') return;
  const city = f.ciudad.value.trim() || cfg.ciudad, changed = fold(city) !== fold(cfg.ciudad);
  Object.assign(cfg, { ciudad: city, modelo: f.modelo.value === 'sonnet' ? 'sonnet' : 'haiku' });
  LS.set('hh.cfg', { ciudad: cfg.ciudad, modelo: cfg.modelo });
  if (changed) loadCatalog();
});

loadCatalog().catch(e => { setStatus('Error'); addMsg('g', `<p>No he podido cargar la ciudad: ${esc(e.message)}</p>`); });
}
</script>
