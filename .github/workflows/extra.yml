name: Imágenes extra (Wikimedia Commons)

# Descarga las imágenes listadas en scripts/extra.txt a img/extra/ (solo las que falten).
on:
  push:
    branches: [main]
    paths: [scripts/extra.txt]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: |
          mkdir -p img/extra
          grep -v '^#' scripts/extra.txt | while read -r nombre url; do
            [ -z "$nombre" ] && continue
            [ -f "img/extra/$nombre" ] && continue
            curl -fsSL -A "neoars-explorador/1.0 (https://github.com/alsase10X/neoars)" -o "img/extra/$nombre" "$url" && echo "ok $nombre" || echo "FALLO $nombre"
          done
          ls -la img/extra
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add img/extra
          git diff --cached --quiet || (git commit -m "Imágenes extra de Wikimedia Commons" && git push)
